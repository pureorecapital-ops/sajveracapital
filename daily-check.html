<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Daily Check-in | Pureore Capital</title>
    <link rel="preconnect" href="https://www.gstatic.com" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* ============================================================
           THEME TOKENS
           ============================================================ */
        :root {
            --bg-black: #030604;

            --emerald-300: #6ee7b7;
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;

            --gold-200: #fff3cf;
            --gold-300: #ffe9a3;
            --gold-400: #f7d774;
            --gold-500: #f5c542;
            --gold-600: #c9992a;

            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.62);
            --faint: rgba(255, 255, 255, 0.42);
        }

        /* ============================================================
           RESET & BASE  (no fixed backgrounds, no scroll-behavior)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: var(--text);
            padding: 14px 12px 40px;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-font-smoothing: antialiased;

            background-color: #030604;
            background-image:
                radial-gradient(680px 400px at 50% -6%, rgba(14, 58, 40, 0.72) 0%, rgba(3, 6, 4, 0) 68%),
                radial-gradient(560px 380px at 100% 100%, rgba(16, 185, 129, 0.08) 0%, rgba(3, 6, 4, 0) 62%),
                linear-gradient(180deg, #061510 0%, #030a07 52%, #020504 100%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-arrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 999px;
            padding: 8px 16px 8px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #c9f7e4;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .back-arrow:hover {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateX(-3px);
        }

        .back-arrow svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-block {
            text-align: right;
            min-width: 0;
        }

        .logo {
            display: inline-block;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #ffffff;
            text-decoration: none;
            line-height: 1.1;
        }

        .logo .pc {
            color: var(--gold-500);
        }

        .brand-sub {
            margin-top: 2px;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(52, 211, 153, 0.85);
        }

        /* ============================================================
           HERO / MAIN TITLE
           ============================================================ */
        .hero {
            text-align: center;
            margin-bottom: 16px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.10);
            border: 1px solid rgba(16, 185, 129, 0.28);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            color: var(--emerald-300);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: clamp(1.55rem, 6.8vw, 2.05rem);
            font-weight: 900;
            letter-spacing: 0.005em;
            line-height: 1.12;
            margin-bottom: 8px;
        }

        .hero h1 .hl {
            color: var(--emerald-400);
            text-shadow: 0 0 22px rgba(52, 211, 153, 0.35);
        }

        .hero-sub {
            font-size: 0.95rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
        }

        .hero-desc {
            font-size: 0.83rem;
            line-height: 1.55;
            color: var(--muted);
            max-width: 380px;
            margin: 0 auto 14px;
        }

        .date-pill {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(150deg, rgba(245, 197, 66, 0.14), rgba(16, 185, 129, 0.08));
            border: 1px solid rgba(245, 197, 66, 0.32);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gold-300);
            letter-spacing: 0.005em;
            box-shadow: 0 10px 28px -18px rgba(245, 197, 66, 0.6);
        }

        .date-pill .calendar-icon {
            font-size: 1rem;
        }

        /* ============================================================
           SUMMARY CARD
           ============================================================ */
        .summary-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            background: linear-gradient(165deg, #0b2c1f 0%, #051a12 55%, #040c09 100%);
            border: 1px solid rgba(245, 197, 66, 0.22);
            box-shadow: 0 18px 40px -28px rgba(0, 0, 0, 0.9);
        }

        .summary-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 197, 66, 0.6), transparent);
            pointer-events: none;
        }

        .summary-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(245, 197, 66, 0.9);
            margin-bottom: 8px;
        }

        .summary-amount {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }

        .summary-amount #coinBalance {
            font-size: clamp(2rem, 9vw, 2.5rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: var(--gold-300);
            text-shadow: 0 0 26px rgba(245, 197, 66, 0.28);
        }

        .summary-amount .unit {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.55);
        }

        .progress-wrap {
            margin-top: 16px;
        }

        .progress-track {
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.12);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #10b981, #34d399, #f5c542);
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.45);
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding: 0 2px;
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.35);
        }

        .progress-labels .mid {
            color: var(--emerald-300);
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .status-line {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.16);
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.01em;
            color: var(--emerald-300);
        }

        /* ============================================================
           7-DAY GRID
           ============================================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 620px) {
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* ============================================================
           DAY CARD
           ============================================================ */
        .day-card {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            min-height: 158px;
            background: linear-gradient(165deg, rgba(11, 44, 31, 0.75) 0%, rgba(4, 12, 9, 0.9) 100%);
            border: 1.5px solid rgba(16, 185, 129, 0.18);
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
        }

        .day-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .day-label {
            font-size: 0.66rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
        }

        .day-badge {
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            padding: 3px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .day-badge.done-badge {
            background: rgba(52, 211, 153, 0.14);
            border: 1px solid rgba(52, 211, 153, 0.42);
            color: var(--emerald-300);
        }

        .day-badge.today-badge {
            background: rgba(245, 197, 66, 0.18);
            border: 1px solid rgba(245, 197, 66, 0.55);
            color: var(--gold-300);
            animation: todayPulse 2s ease-in-out infinite;
        }

        @keyframes todayPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.55);
            }
            60% {
                box-shadow: 0 0 0 7px rgba(245, 197, 66, 0);
            }
        }

        .day-badge.lock-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.35);
        }

        .day-date {
            font-size: 0.68rem;
            font-weight: 600;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.58);
            min-height: 2.6em;
        }

        .day-reward {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--gold-300);
            margin-top: auto;
        }

        .day-reward .coin {
            font-size: 0.9rem;
        }

        .day-action {
            display: block;
            width: 100%;
            padding: 9px 10px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            border: none;
            line-height: 1.2;
        }

        /* ---- CLAIMED STATE ---- */
        .day-card.claimed {
            border-color: rgba(52, 211, 153, 0.42);
            background: linear-gradient(165deg, rgba(11, 46, 32, 0.85) 0%, rgba(4, 16, 11, 0.94) 100%);
            box-shadow:
                0 0 0 1px rgba(52, 211, 153, 0.06) inset,
                0 0 22px -10px rgba(52, 211, 153, 0.55);
        }

        .day-card.claimed .day-label {
            color: var(--emerald-300);
        }

        .day-card.claimed .day-reward {
            color: rgba(110, 231, 183, 0.68);
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }

        .claimed-action {
            background: rgba(52, 211, 153, 0.14);
            border: 1px solid rgba(52, 211, 153, 0.42);
            color: var(--emerald-300);
        }

        /* ---- ACTIVE STATE ---- */
        .day-card.active {
            border-color: rgba(245, 197, 66, 0.72);
            background: linear-gradient(165deg, rgba(14, 56, 38, 0.98) 0%, rgba(7, 22, 15, 0.98) 100%);
            box-shadow:
                0 0 0 1px rgba(245, 197, 66, 0.15) inset,
                0 0 34px -8px rgba(245, 197, 66, 0.6),
                0 14px 30px -22px rgba(0, 0, 0, 0.9);
            transform: translateY(-2px);
        }

        .day-card.active .day-label {
            color: var(--gold-300);
        }

        .day-card.active .day-date {
            color: rgba(255, 255, 255, 0.75);
        }

        .day-card.active .day-reward {
            color: var(--gold-200);
            font-size: 1.2rem;
        }

        .day-claim-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            color: #ffffff;
            box-shadow:
                0 8px 20px -10px rgba(16, 185, 129, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            cursor: pointer;
            transition: transform 0.15s, filter 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .day-claim-btn:hover {
            filter: brightness(1.08);
            box-shadow:
                0 10px 24px -10px rgba(16, 185, 129, 1),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .day-claim-btn:active {
            transform: scale(0.97);
        }

        /* ---- LOCKED STATE ---- */
        .day-card.locked {
            opacity: 0.55;
            background: linear-gradient(165deg, rgba(6, 18, 13, 0.6) 0%, rgba(2, 8, 5, 0.72) 100%);
            border-color: rgba(255, 255, 255, 0.07);
        }

        .day-card.locked .day-reward {
            color: rgba(255, 255, 255, 0.4);
        }

        .day-card.locked .day-date {
            color: rgba(255, 255, 255, 0.32);
        }

        .locked-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.35);
        }

        /* ============================================================
           SUCCESS TOAST / MODAL
           ============================================================ */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .toast-claim {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: calc(100% - 32px);
            max-width: 380px;
            padding: 30px 24px 24px;
            border-radius: 26px;
            text-align: center;
            z-index: 200;
            background: linear-gradient(165deg, #0b2c1f 0%, #04120c 100%);
            border: 1px solid rgba(245, 197, 66, 0.35);
            box-shadow:
                0 30px 80px -30px rgba(0, 0, 0, 0.95),
                0 0 40px -12px rgba(245, 197, 66, 0.35);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }

        .toast-claim.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-claim .icon {
            font-size: 3rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 18px rgba(245, 197, 66, 0.5));
        }

        .toast-claim .amount {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--gold-300);
            text-shadow: 0 0 26px rgba(245, 197, 66, 0.35);
        }

        .toast-claim .label {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.9rem;
            margin-top: 4px;
            font-weight: 600;
        }

        .toast-claim .sub {
            color: rgba(255, 255, 255, 0.42);
            font-size: 0.75rem;
            margin-top: 8px;
            line-height: 1.5;
        }

        .toast-claim .btn-ok {
            margin-top: 18px;
            padding: 13px 28px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            box-shadow:
                0 10px 24px -12px rgba(16, 185, 129, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            transition: transform 0.15s, filter 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .toast-claim .btn-ok:hover {
            filter: brightness(1.08);
        }

        .toast-claim .btn-ok:active {
            transform: scale(0.97);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 420px) {
            body {
                padding: 12px 10px 36px;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            .hero-sub {
                font-size: 0.88rem;
            }

            .hero-desc {
                font-size: 0.8rem;
            }

            .date-pill {
                font-size: 0.78rem;
                padding: 9px 14px;
            }

            .summary-card {
                border-radius: 20px;
                padding: 17px 15px;
            }

            .grid {
                gap: 10px;
            }

            .day-card {
                padding: 12px 10px;
                border-radius: 16px;
                min-height: 150px;
            }

            .day-date {
                font-size: 0.64rem;
            }

            .day-reward {
                font-size: 0.98rem;
            }

            .day-card.active .day-reward {
                font-size: 1.1rem;
            }

            .day-action {
                font-size: 0.66rem;
                padding: 8px 8px;
            }
        }

        @media (max-width: 340px) {
            .day-date {
                font-size: 0.6rem;
            }

            .day-label {
                font-size: 0.6rem;
            }

            .day-reward {
                font-size: 0.92rem;
            }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
             HEADER
             ============================================================ -->
        <header class="header">
            <a href="dashboard.html" class="back-arrow">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
                Back
            </a>
            <div class="brand-block">
                <a href="index.html" class="logo">Pureore<span class="pc">·PC</span></a>
                <div class="brand-sub">Daily Check-in</div>
            </div>
        </header>

        <!-- ============================================================
             HERO / MAIN TITLE
             ============================================================ -->
        <section class="hero">
            <div class="hero-badge"> 7-Day Reward Cycle</div>
            <h1>DAILY <span class="hl">CHECK-IN</span></h1>
            <p class="hero-sub">Claim Your Daily Reward</p>
            <p class="hero-desc">Check in once per day to claim your reward in order.</p>
            <div class="date-pill">
                <span class="calendar-icon"></span>
                <span id="todayDateDisplay">—</span>
            </div>
        </section>

        <!-- ============================================================
             REWARD SUMMARY
             ============================================================ -->
        <section class="summary-card">
            <div class="summary-label"> Your Current Reward</div>
            <div class="summary-amount">
                <span id="coinBalance">0.00</span>
                <span class="unit">coins</span>
            </div>
            <div class="progress-wrap">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <div class="progress-labels">
                    <span>Day 1</span>
                    <span class="mid" id="cycleStatus">0 / 7 completed</span>
                    <span>Day 7</span>
                </div>
            </div>
            <div class="status-line">
                <span id="todayStatus">— Pending</span>
            </div>
        </section>

        <!-- ============================================================
             7-DAY REWARD CARDS GRID
             ============================================================ -->
        <div class="grid" id="checkinGrid"></div>

        <!-- ============================================================
             HIDDEN EXISTING BUTTON (PRESERVED FOR EXISTING LOGIC)
             The card buttons trigger this hidden button so the existing
             claim handler runs unchanged.
             ============================================================ -->
        <button id="checkinBtn" disabled style="display:none"></button>

    </div>

    <!-- ============================================================
         SUCCESS MODAL (preserved IDs: overlay, toastClaim, claimAmount, toastOkBtn)
         ============================================================ -->
    <div class="overlay" id="overlay"></div>
    <div class="toast-claim" id="toastClaim">
        <div class="icon"></div>
        <div class="amount" id="claimAmount">+0</div>
        <div class="label">coins earned!</div>
        <div class="sub">Keep checking in to unlock all rewards.</div>
        <button class="btn-ok" id="toastOkBtn">Go to Profile</button>
    </div>

    <!-- ============================================================
         JAVASCRIPT — EXISTING FUNCTIONALITY PRESERVED
         Only the visual render (renderPage) has been redesigned.
         All Firebase / auth / transaction logic remains untouched.
         ============================================================ -->

        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // STATE
        // ================================================================
        var currentUser = null;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var todayStr = formatDateKey(today);

        // Default rewards (will be overridden by Firestore)
        var defaultRewards = [20, 30, 30, 40, 50, 50, 80];

        // ================================================================
        // HELPERS
        // ================================================================
        function formatDateKey(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getDate() === d2.getDate();
        }

        // Full date, e.g. "Friday, 11 September 2026"
        function formatFullDate(d) {
            try {
                return d.toLocaleDateString('en-GB', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            } catch (e) {
                return d.toDateString();
            }
        }

        // ================================================================
        // FIREBASE AUTH
        // ================================================================
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadData();
        });

        // ================================================================
        // LOAD DATA & RENDER
        // ================================================================
        var rewards = [];
        var lastClaimedDay = 0; // 0 = none, 1-7
        var todayClaimed = false;

        function loadData() {
            if (!currentUser) return;

            var configRef = db.collection('checkinConfig').doc('daily');
            var userRef = db.collection('users').doc(currentUser.uid);
            var claimRef = userRef.collection('checkins').doc(todayStr);

            Promise.all([
                configRef.get(),
                userRef.get(),
                claimRef.get()
            ]).then(function(results) {
                var configDoc = results[0];
                var userDoc = results[1];
                var claimDoc = results[2];

                // Parse rewards
                if (configDoc.exists) {
                    var data = configDoc.data();
                    rewards = [];
                    for (var i = 1; i <= 7; i++) {
                        rewards.push(data['day' + i] || defaultRewards[i - 1]);
                    }
                } else {
                    rewards = defaultRewards.slice();
                }

                // Parse user state
                if (userDoc.exists) {
                    var userData = userDoc.data();
                    lastClaimedDay = userData.checkinDay || 0;
                } else {
                    lastClaimedDay = 0;
                }

                // Check if already claimed today
                todayClaimed = claimDoc.exists;

                renderPage();
            }).catch(function(err) {
                console.error('Error loading data:', err);
                document.getElementById('checkinGrid').innerHTML =
                    '<p style="color:#fca5a5;text-align:center;grid-column:1/-1;padding:20px;">Error loading data. Please refresh.</p>';
            });
        }

        // ================================================================
        // RENDER  (visual-only rewrite — data logic identical)
        // ================================================================
        function renderPage() {
            var grid = document.getElementById('checkinGrid');
            var btn = document.getElementById('checkinBtn');
            var statusEl = document.getElementById('todayStatus');
            var coinBalanceEl = document.getElementById('coinBalance');
            var progressFill = document.getElementById('progressFill');
            var cycleStatus = document.getElementById('cycleStatus');

            // Determine next claimable day (with cycle recycling)
            var nextDay = lastClaimedDay + 1;
            if (nextDay > 7) {
                nextDay = 1; // cycle restarts
            }
            var canClaimToday = !todayClaimed;

            // ---- Date anchoring for each card ----
            // anchorDay = the day index that represents "today"
            var anchorDay;
            if (todayClaimed) {
                anchorDay = (lastClaimedDay === 0) ? 1 : lastClaimedDay;
            } else {
                anchorDay = nextDay;
            }

            var now = new Date();
            now.setHours(0, 0, 0, 0);

            // Update the top full-date pill
            var dateDisplay = document.getElementById('todayDateDisplay');
            if (dateDisplay) {
                dateDisplay.textContent = formatFullDate(now);
            }

            // ---- Build the 7 cards ----
            var html = '';
            var claimedCount = 0;

            for (var i = 0; i < 7; i++) {
                var dayNum = i + 1;
                var reward = rewards[i] || 0;

                // Claimed state (matches existing cycle logic)
                var claimed = false;
                if (lastClaimedDay === 7 && todayClaimed) {
                    claimed = true; // all 7 done in current cycle
                } else if (lastClaimedDay < 7) {
                    claimed = (dayNum <= lastClaimedDay);
                }
                // If lastClaimedDay === 7 && !todayClaimed  new cycle, nothing claimed

                var active = (canClaimToday && dayNum === nextDay);

                // Per-card full date
                var cardDate = new Date(now);
                cardDate.setDate(cardDate.getDate() + (dayNum - anchorDay));
                var dateStr = formatFullDate(cardDate);

                // Build card
                var cardClass = 'day-card';
                var badge = '';
                var action = '';

                if (claimed) {
                    cardClass += ' claimed';
                    badge = '<span class="day-badge done-badge">Done</span>';
                    action = '<div class="day-action claimed-action"> CLAIMED</div>';
                    claimedCount++;
                } else if (active) {
                    cardClass += ' active';
                    badge = '<span class="day-badge today-badge">Today</span>';
                    action = '<button type="button" class="day-action day-claim-btn js-claim"> CLAIM NOW</button>';
                } else {
                    cardClass += ' locked';
                    badge = '<span class="day-badge lock-badge"></span>';
                    action = '<div class="day-action locked-action"> LOCKED</div>';
                }

                var unit = (Number(reward) === 1) ? 'coin' : 'coins';

                html += '<div class="' + cardClass + '">';
                html += '  <div class="day-card-head">';
                html += '    <span class="day-label">DAY ' + dayNum + '</span>';
                html += '    ' + badge;
                html += '  </div>';
                html += '  <div class="day-date">' + dateStr + '</div>';
                html += '  <div class="day-reward"><span class="coin"></span> +' + reward + ' ' + unit + '</div>';
                html += '  ' + action;
                html += '</div>';
            }

            grid.innerHTML = html;

            // ---- Progress bar ----
            var progressPercent = (claimedCount / 7) * 100;
            progressFill.style.width = progressPercent + '%';
            cycleStatus.textContent = claimedCount + ' / 7 completed';

            // ---- Status line ----
            if (todayClaimed) {
                statusEl.textContent = ' Claimed today (Day ' + lastClaimedDay + ')';
                statusEl.style.color = '#6ee7b7';
            } else if (lastClaimedDay === 7 && !todayClaimed) {
                statusEl.textContent = ' Day 7 completed! Starting a new cycle.';
                statusEl.style.color = '#ffe9a3';
            } else if (canClaimToday) {
                statusEl.textContent = ' Day ' + nextDay + ' ready to claim';
                statusEl.style.color = '#ffe9a3';
            } else {
                statusEl.textContent = 'Come back tomorrow';
                statusEl.style.color = 'rgba(255,255,255,0.6)';
            }

            // ---- Balance (unchanged fetch) ----
            db.collection('users').doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists) {
                    var bal = doc.data().walletBalance || 0;
                    coinBalanceEl.textContent = bal.toFixed(2);
                }
            }).catch(console.warn);

            // ---- Hidden button state (drives the existing claim handler) ----
            btn.disabled = !canClaimToday;
            if (canClaimToday) {
                btn.innerHTML = '<span class="coin-icon"></span> Check In (Day ' + nextDay + ')';
            } else {
                if (todayClaimed) {
                    btn.innerHTML = '<span class="coin-icon"></span> Claimed Today';
                } else if (lastClaimedDay === 7) {
                    btn.innerHTML = '<span class="coin-icon"></span> Cycle Complete!';
                } else {
                    btn.innerHTML = '<span class="coin-icon"></span> Come Back Tomorrow';
                }
            }
        }

        // ================================================================
        // CARD CLAIM BUTTONS  trigger the EXISTING hidden button handler.
        // No new claim system. No duplicated logic.
        // ================================================================
        document.getElementById('checkinGrid').addEventListener('click', function(e) {
            var t = e.target;
            // Walk up to find the claim button
            while (t && t !== this) {
                if (t.classList && t.classList.contains('js-claim')) {
                    var btn = document.getElementById('checkinBtn');
                    if (btn && !btn.disabled) {
                        btn.click();
                    }
                    return;
                }
                t = t.parentNode;
            }
        });

        // ================================================================
        // CHECK-IN ACTION (UNCHANGED — with cycle recycling)
        // ================================================================
        document.getElementById('checkinBtn').addEventListener('click', function() {
            if (this.disabled) return;
            var uid = currentUser.uid;

            this.disabled = true;
            this.innerHTML = ' Processing...';

            // Run transaction
            db.runTransaction(function(transaction) {
                var configRef = db.collection('checkinConfig').doc('daily');
                var userRef = db.collection('users').doc(uid);
                var claimRef = userRef.collection('checkins').doc(todayStr);

                return transaction.get(configRef).then(function(configDoc) {
                    var rewards = defaultRewards.slice();
                    if (configDoc.exists) {
                        var data = configDoc.data();
                        for (var i = 1; i <= 7; i++) {
                            if (data['day' + i] !== undefined) rewards[i - 1] = data['day' + i];
                        }
                    }

                    return transaction.get(userRef).then(function(userDoc) {
                        var userData = userDoc.exists ? userDoc.data() : {};
                        var currentDay = userData.checkinDay || 0;

                        // Next day to claim (with cycle recycling)
                        var nextDay = currentDay + 1;
                        if (nextDay > 7) {
                            nextDay = 1; // restart cycle
                        }

                        var rewardAmount = rewards[nextDay - 1] || 0;

                        // Check if claim already exists for today
                        return transaction.get(claimRef).then(function(claimDoc) {
                            if (claimDoc.exists) {
                                throw new Error('Already claimed today');
                            }

                            // Create claim record with day number
                            transaction.set(claimRef, {
                                day: nextDay,
                                amount: rewardAmount,
                                claimedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            // Update user: increment checkinDay (with cycle recycling)
                            transaction.update(userRef, {
                                checkinDay: nextDay,
                                lastCheckin: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            if (rewardAmount > 0) {
                                transaction.update(userRef, {
                                    walletBalance: firebase.firestore.FieldValue.increment(rewardAmount)
                                });
                            }

                            return rewardAmount;
                        });
                    });
                });
            }).then(function(amount) {
                showClaimSuccess(amount);
            }).catch(function(err) {
                console.error('Check-in error:', err);
                alert(' ' + err.message);
                document.getElementById('checkinBtn').disabled = false;
                document.getElementById('checkinBtn').innerHTML = '<span class="coin-icon"></span> Check In';
            });
        });

        // ================================================================
        // SUCCESS MODAL + REDIRECT
        // ================================================================
        function showClaimSuccess(amount) {
            var overlay = document.getElementById('overlay');
            var toast = document.getElementById('toastClaim');
            var amountEl = document.getElementById('claimAmount');

            amountEl.textContent = '+' + amount;
            overlay.classList.add('show');
            toast.classList.add('show');

            document.getElementById('toastOkBtn').addEventListener('click', function() {
                window.location.href = 'me.html';
            });
        }

        // ================================================================
        // INIT
        // ================================================================
        console.log(' Daily Check-in – Premium forest/emerald design');
        console.log(' Cycle recycling after Day 7 preserved');
        console.log(' Full dates per card + automatic today date');
        console.log(' Per-card claim buttons trigger existing handler');
    </script>
</body>
</html>
