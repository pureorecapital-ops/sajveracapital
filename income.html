    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",

            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: false });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        // ================================================================
        // ZAMBIA TIMEZONE HELPERS
        // ================================================================
        var ZAMBIA_OFFSET_MS = 2 * 3600 * 1000;

        function getZambiaDayNumber(date) {
            return Math.floor((date.getTime() + ZAMBIA_OFFSET_MS) / 86400000);
        }
        function getZambiaDayOfWeek(date) {
            var dayNum = getZambiaDayNumber(date);
            return ((dayNum + 4) % 7 + 7) % 7;
        }
        function isBusinessDayNumber(dayNum) {
            var dow = ((dayNum + 4) % 7 + 7) % 7;
            return dow >= 1 && dow <= 5;
        }
        function nextBusinessDayNumber(dayNum) {
            var d = dayNum + 1;
            while (!isBusinessDayNumber(d)) d++;
            return d;
        }
        function dayNumberToUtcMs(dayNum) {
            return dayNum * 86400000 - ZAMBIA_OFFSET_MS;
        }
        function getZambiaHour(date) {
            var zambiaMs = date.getTime() + ZAMBIA_OFFSET_MS;
            return Math.floor((((zambiaMs % 86400000) + 86400000) % 86400000) / 3600000);
        }
        function getZambiaMinute(date) {
            var zambiaMs = date.getTime() + ZAMBIA_OFFSET_MS;
            return Math.floor((((zambiaMs % 3600000) + 3600000) % 3600000) / 60000);
        }
        function isWeekend(date) {
            var dow = getZambiaDayOfWeek(date);
            return dow === 0 || dow === 6;
        }
        function addBusinessDays(startDate, numDays) {
            var d = getZambiaDayNumber(startDate);
            for (var i = 0; i < numDays; i++) d = nextBusinessDayNumber(d);
            return new Date(dayNumberToUtcMs(d));
        }

        // ================================================================
        // ⭐ SERVER TIME — CORE SECURITY FIX
        // ================================================================
        var serverTimeOffsetMs = null;
        var lastServerSyncMs   = 0;
        var SERVER_SYNC_TTL_MS = 60000;
        var SERVER_TIME_PATH   = ['_sys', 'clock'];

        async function probeServerTimeMs() {
            if (!currentUserId) return null;
            var t0 = Date.now();
            try {
                var ref = db.collection('users').doc(currentUserId)
                            .collection(SERVER_TIME_PATH[0]).doc(SERVER_TIME_PATH[1]);
                await ref.set({ pingAt: firebase.firestore.FieldValue.serverTimestamp() });
                var snap = await ref.get();
                var t1 = Date.now();
                if (!snap.exists) return null;
                var data = snap.data();
                if (!data || !data.pingAt || typeof data.pingAt.toMillis !== 'function') return null;
                var serverMs = data.pingAt.toMillis();
                var rtt = t1 - t0;
                var serverNowMs = serverMs + Math.floor(rtt / 2);
                serverTimeOffsetMs = serverNowMs - t1;
                lastServerSyncMs   = t1;
                return serverNowMs;
            } catch (e) {
                console.warn('[serverTime] probe failed:', e && e.message);
                return null;
            }
        }

        function getAdjustedNow() {
            if (serverTimeOffsetMs === null) return new Date();
            return new Date(Date.now() + serverTimeOffsetMs);
        }

        async function getAuthoritativeNowMs() {
            var ms = await probeServerTimeMs();
            if (ms !== null) return ms;
            if (serverTimeOffsetMs !== null) return Date.now() + serverTimeOffsetMs;
            return null;
        }

        // ================================================================
        // HELPERS
        // ================================================================
        function formatMoney(amount) {
            return 'K' + parseFloat(amount).toFixed(2);
        }
        function showToast(msg, isError) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        function formatDateWithTime(date) {
            if (!date) return '—';
            var z = new Date(date.getTime() + ZAMBIA_OFFSET_MS);
            var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            var dow = z.getUTCDay(), mon = z.getUTCMonth(), day = z.getUTCDate();
            var h = z.getUTCHours(), m = z.getUTCMinutes();
            var ampm = h >= 12 ? 'PM' : 'AM';
            var h12 = h % 12 || 12;
            return days[dow] + ', ' + months[mon] + ' ' + day + ', ' +
                   (h12 < 10 ? '0' : '') + h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm + ' (CAT)';
        }
        function getSafeImageUrl(url) {
            if (!url || typeof url !== 'string' || url.trim() === '')
                return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            var safeUrl = url.trim();
            if (safeUrl.includes('ibb.co/') && !safeUrl.includes('i.ibb.co')) {
                var match = safeUrl.match(/ibb\.co\/([a-zA-Z0-9]+)(\/[^ ]*)?/);
                if (match && match[1]) {
                    var code = match[1]; var filename = match[2] || ''; var ext = 'jpg';
                    if (filename) { var em = filename.match(/\.([a-zA-Z0-9]+)$/); if (em && em[1]) ext = em[1]; }
                    safeUrl = 'https://i.ibb.co/' + code + '/image.' + ext;
                    if (filename) safeUrl = 'https://i.ibb.co/' + code + filename;
                }
            }
            if (safeUrl.includes('imgur.com/') && !safeUrl.includes('i.ibb.co')) {
                var m2 = safeUrl.match(/imgur\.com\/([a-zA-Z0-9]+)/);
                if (m2 && m2[1]) safeUrl = 'https://i.imgur.com/' + m2[1] + '.jpg';
            }
            if (safeUrl.startsWith('http://')) safeUrl = safeUrl.replace('http://', 'https://');
            if (safeUrl.startsWith('//')) safeUrl = 'https:' + safeUrl;
            if (!safeUrl.startsWith('https://')) return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            return safeUrl;
        }

        // ================================================================
        // STATE
        // ================================================================
        var currentUserId = null;
        var refreshInterval = null;
        var timerInterval = null;
        var syncInterval = null;
        var userBlockListener = null;
        var planImageCache = {};
        var allActivePlans = [];

        var inFlightClaims = Object.create(null);
        var claimAllRunning = false;
        function lockKey(id) { return 'plan:' + id; }
        function isLocked(id) { return inFlightClaims[lockKey(id)] === true; }

        window.addEventListener('beforeunload', function() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (timerInterval) clearInterval(timerInterval);
            if (syncInterval) clearInterval(syncInterval);
            if (userBlockListener) userBlockListener();
        });

        // ================================================================
        // BLOCK LISTENER
        // ================================================================
        function watchBlockStatus(userId) {
            if (userBlockListener) userBlockListener();
            userBlockListener = db.collection('users').doc(userId)
                .onSnapshot(function(doc) {
                    if (doc.exists && doc.data().isBlocked === true) {
                        showToast('⚠️ Your account has been blocked. Redirecting...', true);
                        setTimeout(function() {
                            auth.signOut().then(function() { window.location.href = 'login.html'; });
                        }, 2000);
                    }
                }, function(err) { console.warn('Block listener error:', err); });
        }

        // ================================================================
        // AUTH STATE
        // ================================================================
        let authResolved = false;
        let redirectTimeout = null;

        auth.onAuthStateChanged(function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) { clearTimeout(redirectTimeout); redirectTimeout = null; }
                currentUserId = user.uid;
                watchBlockStatus(currentUserId);

                probeServerTimeMs().then(function () { loadAllPlans(); });

                if (syncInterval) clearInterval(syncInterval);
                syncInterval = setInterval(function () { probeServerTimeMs(); }, 5 * 60 * 1000);

                loadAllPlans();

                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(function() {
                    var activeTab = document.getElementById('activeTab');
                    if (activeTab && activeTab.style.display !== 'none') loadAllPlans();
                }, 60000);

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateTimers, 1000);

                db.collection('users').doc(user.uid).get().then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        document.getElementById('panelName').textContent = data.fullName || 'User';
                        document.getElementById('panelEmail').textContent = data.email || user.email;
                    }
                }).catch(console.warn);
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) window.location.href = 'login.html';
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // FETCH PLAN IMAGE
        // ================================================================
        async function fetchPlanImage(planName) {
            if (planImageCache[planName]) return planImageCache[planName];
            try {
                var snapshot = await db.collection('marketplacePlans')
                    .where('planName', '==', planName).limit(1).get();
                if (!snapshot.empty) {
                    var data = snapshot.docs[0].data();
                    var img = getSafeImageUrl(data.imageUrl || data.image);
                    planImageCache[planName] = img;
                    return img;
                }
                var d = 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
                planImageCache[planName] = d;
                return d;
            } catch (err) {
                return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
            }
        }

        function lastClaimedToDate(lastClaimed) {
            if (!lastClaimed) return null;
            if (typeof lastClaimed.toDate === 'function') return lastClaimed.toDate();
            if (lastClaimed instanceof Date) return lastClaimed;
            if (typeof lastClaimed === 'number') return new Date(lastClaimed);
            if (typeof lastClaimed.seconds === 'number') return new Date(lastClaimed.seconds * 1000);
            return null;
        }

        function getLastClaimedDayNumber(plan) {
            if (plan && typeof plan.lastClaimDay === 'number') return plan.lastClaimDay;
            var d = lastClaimedToDate(plan ? plan.lastClaimed : null);
            return d ? getZambiaDayNumber(d) : null;
        }

        // ================================================================
        // INCOME STATUS — single source of truth
        // ================================================================
        function getClaimStatus(plan, now) {
            var startDate = plan.startDate;
            if (!(startDate instanceof Date)) {
                startDate = startDate && startDate.toDate ? startDate.toDate() : new Date(startDate);
            }
            var totalBusinessDays = plan.businessDays || plan.days || 0;
            var claimsCount = plan.claimsCount || 0;
            var dailyAmount = plan.dailyReturn || plan.dailyAmount || 0;

            var nowDay = getZambiaDayNumber(now);
            var startDay = getZambiaDayNumber(startDate);
            var todayDow = getZambiaDayOfWeek(now);
            var todayIsBusiness = todayDow >= 1 && todayDow <= 5;
            var zambiaHour = getZambiaHour(now);
            var zambiaMinute = getZambiaMinute(now);
            var beforeDeadline = zambiaHour < 22;

            var firstIncomeDay = nextBusinessDayNumber(startDay);
            var lastIncomeDay = startDay;
            for (var i = 0; i < totalBusinessDays; i++) lastIncomeDay = nextBusinessDayNumber(lastIncomeDay);

            var daysRemaining = Math.max(0, totalBusinessDays - claimsCount);

            if (claimsCount >= totalBusinessDays || nowDay > lastIncomeDay) {
                return { available:false, nextClaimTime:null, dailyAmount:dailyAmount, earnedSoFar:0, progress:100, daysRemaining:0, status:'done', isSunday:false };
            }
            if (nowDay < firstIncomeDay) {
                return { available:false, nextClaimTime:new Date(dayNumberToUtcMs(firstIncomeDay)), dailyAmount:dailyAmount, earnedSoFar:0, progress:0, daysRemaining:daysRemaining, status:'waiting', isSunday:todayDow === 0 };
            }
            if (!todayIsBusiness) {
                var nb = nextBusinessDayNumber(nowDay);
                return { available:false, nextClaimTime:new Date(dayNumberToUtcMs(nb)), dailyAmount:dailyAmount, earnedSoFar:0, progress:0, daysRemaining:daysRemaining, status:'weekend', isSunday:todayDow === 0 };
            }
            var lastClaimedDay = getLastClaimedDayNumber(plan);
            if (lastClaimedDay !== null && lastClaimedDay === nowDay) {
                var nb2 = nextBusinessDayNumber(nowDay);
                return { available:false, nextClaimTime:new Date(dayNumberToUtcMs(nb2)), dailyAmount:dailyAmount, earnedSoFar:0, progress:100, daysRemaining:daysRemaining, status:'claimed_today', isSunday:false };
            }
            if (!beforeDeadline) {
                var nb3 = nextBusinessDayNumber(nowDay);
                return { available:false, nextClaimTime:new Date(dayNumberToUtcMs(nb3)), dailyAmount:dailyAmount, earnedSoFar:0, progress:0, daysRemaining:daysRemaining, status:'missed', isSunday:false };
            }
            var hoursElapsed = zambiaHour + (zambiaMinute / 60);
            var earnedSoFar = Math.min(dailyAmount, dailyAmount * (hoursElapsed / 22));
            var progress = Math.min(100, (hoursElapsed / 22) * 100);
            return { available:true, nextClaimTime:null, dailyAmount:dailyAmount, earnedSoFar:earnedSoFar, progress:progress, daysRemaining:daysRemaining, status:'ready', isSunday:false };
        }

        async function markExhaustedPlans(plan) {
            var startDate = plan.startDate;
            if (!(startDate instanceof Date)) {
                startDate = startDate && startDate.toDate ? startDate.toDate() : new Date(startDate);
            }
            var totalBusinessDays = plan.businessDays || plan.days || 0;
            var claimsCount = plan.claimsCount || 0;
            var nowDay = getZambiaDayNumber(getAdjustedNow());
            var startDay = getZambiaDayNumber(startDate);
            var lastIncomeDay = startDay;
            for (var i = 0; i < totalBusinessDays; i++) lastIncomeDay = nextBusinessDayNumber(lastIncomeDay);
            var exhausted = (nowDay > lastIncomeDay) || (claimsCount >= totalBusinessDays);
            if (exhausted && plan.status === 'active') plan.status = 'completed';
            return plan;
        }

        // ================================================================
        // LOAD ALL PLANS
        // ================================================================
        async function loadAllPlans() {
            if (!currentUserId) return;
            try {
                var invSnapshot = await db.collection('investments')
                    .where('userId', '==', currentUserId).get();
                var investPlans = [];
                for (var doc of invSnapshot.docs) {
                    var data = doc.data();
                    data.id = doc.id;
                    data.planType = 'invest';
                    if (data.startDate) data.startDate = data.startDate.toDate();
                    if (data.businessEndDate) data.businessEndDate = data.businessEndDate.toDate();
                    investPlans.push(data);
                }
                for (var plan of investPlans) {
                    if (plan.status === 'active') await markExhaustedPlans(plan);
                }
                var buySnapshot = await db.collection('marketplacePurchases')
                    .where('userId', '==', currentUserId).where('type', '==', 'buy').get();
                var buyPlans = [];
                buySnapshot.forEach(function(doc) {
                    var data = doc.data();
                    buyPlans.push({ id: doc.id, ...data, planType: 'buy' });
                });
                var allPlans = [...investPlans, ...buyPlans];
                allPlans.sort(function(a, b) {
                    var aT = (a.startDate || a.purchasedAt)?.toMillis ? (a.startDate || a.purchasedAt).toMillis() : 0;
                    var bT = (b.startDate || b.purchasedAt)?.toMillis ? (b.startDate || b.purchasedAt).toMillis() : 0;
                    return bT - aT;
                });
                var now = getAdjustedNow();
                var active = [], expired = [];
                for (var i = 0; i < allPlans.length; i++) {
                    var plan = allPlans[i];
                    if (plan.planType === 'invest') {
                        var startDate = plan.startDate;
                        var businessDays = plan.businessDays || plan.days;
                        var endDate = plan.businessEndDate ? plan.businessEndDate : addBusinessDays(startDate, businessDays);
                        var nowDay = getZambiaDayNumber(now);
                        var startDay = getZambiaDayNumber(startDate);
                        var lastIncomeDay = startDay;
                        for (var k = 0; k < businessDays; k++) lastIncomeDay = nextBusinessDayNumber(lastIncomeDay);
                        var slotExhausted = nowDay > lastIncomeDay;
                        var allClaimed = (plan.claimsCount || 0) >= businessDays;
                        var isExpired = false;
                        if (plan.status === 'completed' || slotExhausted || allClaimed) isExpired = true;

                        // ⭐ FIX #1 — preserve whichever field the doc actually has.
                        // Previously: dailyAmount: plan.dailyReturn
                        //   → wiped out the value when the doc stored only `dailyAmount`.
                        var normalizedDaily =
                            (typeof plan.dailyReturn === 'number' ? plan.dailyReturn : null);
                        if (normalizedDaily === null && typeof plan.dailyAmount === 'number')
                            normalizedDaily = plan.dailyAmount;
                        if (normalizedDaily === null) normalizedDaily = 0;

                        var investment = {
                            id: plan.id, ...plan,
                            startDate: startDate, businessDays: businessDays, endDate: endDate,
                            dailyAmount: normalizedDaily,
                            dailyReturn: normalizedDaily,       // keep both in sync
                            claimsCount: plan.claimsCount || 0,
                            lastClaimed: plan.lastClaimed || null,
                            lastClaimDay: (typeof plan.lastClaimDay === 'number') ? plan.lastClaimDay : null,
                            purchasedOnWeekend: plan.purchasedOnWeekend || false,
                            planType: 'invest', claimable: true
                        };
                        if (!isExpired) active.push(investment); else expired.push(investment);
                    } else {
                        var expiryDate = plan.expiresAt ? plan.expiresAt.toDate() : null;
                        var isExpiredBuy = plan.status === 'claimed' || plan.status === 'expired' || (expiryDate && now > expiryDate);
                        var rawAmount = 0;
                        if (typeof plan.amount === 'number') rawAmount = plan.amount;
                        else if (typeof plan.purchaseAmount === 'number') rawAmount = plan.purchaseAmount;
                        var rawProfit = (typeof plan.totalIncome === 'number') ? plan.totalIncome : 0;
                        var buyPlan = {
                            id: plan.id, ...plan, planType: 'buy', expiryDate: expiryDate,
                            amount: rawAmount,
                            totalIncome: rawProfit,
                            finalAmount: rawAmount + rawProfit,   // ⭐ same formula as the transaction
                            status: plan.status || 'active',
                            claimedAt: plan.claimedAt || null,
                            claimAmount: plan.claimAmount || null,
                            claimable: false
                        };
                        if (!isExpiredBuy) active.push(buyPlan); else expired.push(buyPlan);
                    }
                }
                allActivePlans = active;
                await renderActive(active);
                renderExpired(expired);
                updateTotalPendingAndClaimAll(active);
            } catch (err) {
                console.error("Error loading plans:", err);
                var container = document.getElementById('activePlansContainer');
                if (container) container.innerHTML =
                    '<div class="empty-state"><div class="title">Error loading plans</div><div class="sub">Please refresh the page</div></div>';
            }
        }

        // ================================================================
        // RENDER ACTIVE
        // ================================================================
        async function renderActive(plans) {
            var container = document.getElementById('activePlansContainer');
            if (!container) return;
            if (!plans.length) {
                container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div class="title">No active plans</div><div class="sub">Purchase an investment or Buy plan to start earning</div></div>';
                return;
            }
            var imagePromises = plans.map(function(p) {
                return fetchPlanImage(p.planName).catch(function() { return 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg'; });
            });
            var images = await Promise.all(imagePromises);
            var now = getAdjustedNow();
            var html = '';
            for (var i = 0; i < plans.length; i++) {
                var plan = plans[i];
                var img = images[i] || 'https://i.ibb.co/BKHsdj4B/IMG-20260525-114417.jpg';
                var busy = isLocked(plan.id);
                if (plan.planType === 'invest') {
                    var status = getClaimStatus(plan, now);
                    var daysLeft = status.daysRemaining;
                    var totalClaimed = (plan.claimsCount || 0) * plan.dailyAmount;
                    var claimsCount = plan.claimsCount || 0;
                    var statusText = '';
                    var countdownText = '';
                    if (busy) { statusText = '⏳ Claiming…'; }
                    else if (status.status === 'ready') statusText = '✅ Ready to claim';

        // ================================================================
        // UPDATE TIMERS
        // ================================================================
        function updateTimers() {
            var now = getAdjustedNow();
            var cards = document.querySelectorAll('.plan-card[data-next-claim]');
            cards.forEach(function(card) {
                var nextClaim = card.dataset.nextClaim;
                if (!nextClaim) return;
                var targetTime = parseInt(nextClaim);
                if (isNaN(targetTime)) return;
                var diff = (targetTime - now.getTime()) / 1000;
                var countdownEl = card.querySelector('.countdown');
                if (!countdownEl) return;
                if (diff <= 0) { countdownEl.textContent = '0h 0m'; return; }
                var hrs = Math.floor(diff / 3600);
                var mins = Math.floor((diff % 3600) / 60);
                countdownEl.textContent = hrs + 'h ' + mins + 'm';
            });
        }

        // ================================================================
        // UPDATE TOTALS & CLAIM ALL
        // ================================================================
        function updateTotalPendingAndClaimAll(plans) {
            var now = getAdjustedNow();
            var total = 0;
            var hasClaimable = false;
            for (var i = 0; i < plans.length; i++) {
                var plan = plans[i];
                if (plan.planType === 'invest') {
                    var status = getClaimStatus(plan, now);
                    if (status.available && !isLocked(plan.id)) {
                        total += status.dailyAmount;
                        hasClaimable = true;
                    }
                }
            }
            var totalSpan = document.getElementById('totalPending');
            if (totalSpan) totalSpan.innerText = total.toFixed(2) + ' ZMW';
            var claimAllBtn = document.getElementById('claimAllBtn');
            if (claimAllBtn) claimAllBtn.disabled = !hasClaimable || claimAllRunning;
        }

        // ================================================================
        // ⭐ CLAIM DAILY INCOME
        // ----------------------------------------------------------------
        // RETURNS: the credited amount (number > 0) on success, 0 on failure.
        // ----------------------------------------------------------------
        async function claimDailyIncome(investmentId, dailyAmount, refreshAfter, btnElement) {
            var user = auth.currentUser;
            if (!user) { showToast('Please log in.', true); return 0; }
            if (isLocked(investmentId)) { showToast('⏳ A claim for this plan is already in progress.', true); return 0; }

            inFlightClaims[lockKey(investmentId)] = true;
            if (btnElement) btnElement.disabled = true;

            var claimedAmount = 0;
            var success = false;
            var failureMsg = '';

            try {
                var serverNowMs = await getAuthoritativeNowMs();
                if (serverNowMs === null) throw new Error('Time verification failed');

                var serverNow = new Date(serverNowMs);
                var todayNum  = getZambiaDayNumber(serverNow);

                var invRef    = db.collection('investments').doc(investmentId);
                var userRef   = db.collection('users').doc(user.uid);
                var ledgerRef = db.collection('transactions').doc('daily_' + investmentId + '_' + todayNum);

                await db.runTransaction(async function(transaction) {
                    var invSnap    = await transaction.get(invRef);
                    var ledgerSnap = await transaction.get(ledgerRef);

                    if (!invSnap.exists) throw new Error('Investment not found');
                    var invData = invSnap.data();

                    if (invData.userId !== user.uid) throw new Error('Unauthorized');

                    if (ledgerSnap.exists) throw new Error('Already claimed today');

                    if (typeof invData.lastClaimDay === 'number' &&
                        invData.lastClaimDay === todayNum) {
                        throw new Error('Already claimed today');
                    }

                    var lastDate = lastClaimedToDate(invData.lastClaimed);
                    if (lastDate && getZambiaDayNumber(lastDate) === todayNum) {
                        throw new Error('Already claimed today');
                    }

                    var start = invData.startDate && invData.startDate.toDate
                        ? invData.startDate.toDate()
                        : new Date(invData.startDate);
                    var claimsCount       = invData.claimsCount || 0;
                    var totalBusinessDays = invData.businessDays || invData.days || 0;

                    // ⭐ Authoritative amount read INSIDE the transaction.
                    var planDailyAmount = 0;
                    if (typeof invData.dailyReturn === 'number') planDailyAmount = invData.dailyReturn;
                    else if (typeof invData.dailyAmount === 'number') planDailyAmount = invData.dailyAmount;
                    else if (typeof dailyAmount === 'number' && !isNaN(dailyAmount)) planDailyAmount = dailyAmount;

                    if (totalBusinessDays > 0 && claimsCount >= totalBusinessDays) {
                        throw new Error('Plan completed');
                    }

                    var status = getClaimStatus({
                        startDate: start,
                        claimsCount: claimsCount,
                        dailyAmount: planDailyAmount,
                        dailyReturn: planDailyAmount,
                        businessDays: totalBusinessDays,
                        lastClaimed: invData.lastClaimed,
                        lastClaimDay: invData.lastClaimDay
                    }, serverNow);

                    if (!status.available) throw new Error('Claim not available at this time');

                    transaction.update(userRef, {
                        balance: firebase.firestore.FieldValue.increment(planDailyAmount)
                    });

                    transaction.update(invRef, {
                        claimsCount: firebase.firestore.FieldValue.increment(1),
                        lastClaimed: firebase.firestore.FieldValue.serverTimestamp(),
                        lastClaimDay: todayNum
                    });

                    transaction.set(ledgerRef, {
                        userId: user.uid,
                        investmentId: investmentId,
                        type: 'daily_income',
                        amount: planDailyAmount,
                        dayNumber: todayNum,
                        description: 'Daily income from ' + (invData.planName || 'investment'),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    claimedAmount = planDailyAmount;
                });

                success = true;
            } catch (err) {
                console.error("Invest claim error:", err);
                var msg = err.message || 'Claim failed';
                if (msg === 'Already claimed today') msg = 'You have already claimed today\'s income for this plan.';
                else if (msg === 'Plan completed') msg = 'This plan has finished.';
                else if (msg.indexOf('not available') !== -1) msg = 'Claim window closed. Income is available 00:00–22:00 (CAT).';
                else if (msg === 'Unauthorized') msg = 'This plan does not belong to your account.';
                else if (msg === 'Time verification failed') msg = 'Could not verify server time. Check your connection and try again.';
                else if (err && err.code === 'permission-denied') msg = 'Permission denied. Please refresh the page and try again.';
                else if (err && err.code === 'unavailable') msg = 'Network error. Please check your internet connection.';
                failureMsg = msg;
            } finally {
                delete inFlightClaims[lockKey(investmentId)];
                if (btnElement && btnElement.isConnected && !success) btnElement.disabled = false;
            }

            if (success) {
                // ⭐ Toast shows EXACTLY the amount credited by the transaction.
                showToast('✅ ' + formatMoney(claimedAmount) + ' claimed!', false);
                if (refreshAfter) await loadAllPlans();
                return claimedAmount;
            }
            showToast(failureMsg || 'Claim failed', true);
            return 0;
        }

        // ================================================================
        // ⭐ CLAIM BUY PLAN
        // ----------------------------------------------------------------
        // FIX #2 — use the same capital+profit formula as the display,
        // including purchaseAmount fallback.
        // ================================================================
        async function claimBuyPlan(purchaseId, btnElement) {
            var user = auth.currentUser;
            if (!user) { showToast('Please log in.', true); return false; }
            if (isLocked(purchaseId)) { showToast('⏳ A claim for this plan is already in progress.', true); return false; }

            inFlightClaims[lockKey(purchaseId)] = true;
            if (btnElement) btnElement.disabled = true;

            var uid = user.uid;
            var finalAmountGlobal = 0;
            var success = false;
            var failureMsg = '';

            try {
                var serverNowMs = await getAuthoritativeNowMs();
                if (serverNowMs === null) throw new Error('Time verification failed');
                var serverNow = new Date(serverNowMs);

                await db.runTransaction(async function(transaction) {
                    var purchaseRef = db.collection('marketplacePurchases').doc(purchaseId);
                    var purchaseSnap = await transaction.get(purchaseRef);
                    if (!purchaseSnap.exists) throw new Error('Plan not found');
                    var purchaseData = purchaseSnap.data();

                    if (purchaseData.userId !== uid) throw new Error('Unauthorized');
                    if (purchaseData.status === 'claimed') throw new Error('Already claimed');

                    var expiryTx = purchaseData.expiresAt ? purchaseData.expiresAt.toDate() : null;
                    if (!expiryTx || serverNow < expiryTx) throw new Error('Not matured');

                    // ⭐ FIX #2 — accept both field names so credit matches display.
                    var amount = 0;
                    if (typeof purchaseData.amount === 'number') amount = purchaseData.amount;
                    else if (typeof purchaseData.purchaseAmount === 'number') amount = purchaseData.purchaseAmount;

                    var totalIncome = (typeof purchaseData.totalIncome === 'number') ? purchaseData.totalIncome : 0;
                    var finalAmount = amount + totalIncome;
                    finalAmountGlobal = finalAmount;

                    transaction.update(db.collection('users').doc(uid), {
                        balance: firebase.firestore.FieldValue.increment(finalAmount)
                    });
                    transaction.update(purchaseRef, {
                        status: 'claimed',
                        claimedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        claimAmount: finalAmount
                    });
                    transaction.set(db.collection('transactions').doc('buy_' + purchaseId), {
                        userId: uid,
                        purchaseId: purchaseId,
                        type: 'buy_plan_claim',
                        amount: finalAmount,
                        description: 'Buy plan claim: ' + (purchaseData.planName || 'Buy plan'),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                success = true;
            } catch (err) {
                console.error("Buy claim error:", err);
                var msg = err.message || 'Claim failed';
                if (msg === 'Already claimed') msg = 'This plan has already been claimed.';
                else if (msg === 'Not matured') msg = 'This plan is not yet ready for claim.';
                else if (msg === 'Unauthorized') msg = 'This plan does not belong to your account.';
                else if (msg === 'Time verification failed') msg = 'Could not verify server time. Check your connection and try again.';
                else if (err && err.code === 'permission-denied') msg = 'Permission denied. Please refresh the page and try again.';
                else if (err && err.code === 'unavailable') msg = 'Network error. Please check your internet connection.';
                failureMsg = msg;
            } finally {
                delete inFlightClaims[lockKey(purchaseId)];
                if (btnElement && btnElement.isConnected && !success) btnElement.disabled = false;
            }

            if (success) {
                showToast('✅ ' + formatMoney(finalAmountGlobal) + ' claimed!', false);
                await loadAllPlans();
                return true;
            }
            showToast(failureMsg || 'Claim failed', true);
            return false;
        }

        // ================================================================
        // CLAIM ALL (Invest only)
        // ----------------------------------------------------------------
        // FIX #3 — sum the ACTUAL credited amount returned by the transaction,
        // not the pre-click display value.
        // ================================================================
        async function claimAllAvailable() {
            var user = auth.currentUser;
            if (!user) return;
            if (claimAllRunning) { showToast('⏳ A claim is already in progress.', true); return; }

            var now = getAdjustedNow();
            var claimable = [];
            for (var i = 0; i < allActivePlans.length; i++) {
                var plan = allActivePlans[i];
                if (plan.planType !== 'invest') continue;
                if (isLocked(plan.id)) continue;
                var status = getClaimStatus(plan, now);
                if (status.available) claimable.push({ id: plan.id, dailyAmount: status.dailyAmount });
            }

            if (claimable.length === 0) {
                showToast('No pending earnings to claim.', true);
                updateTotalPendingAndClaimAll(allActivePlans);
                return;
            }

            claimAllRunning = true;
            var claimBtn = document.getElementById('claimAllBtn');
            if (claimBtn) { claimBtn.disabled = true; claimBtn.innerText = 'Claiming...'; }

            var totalClaimed = 0;
            var successCount = 0;
            for (var j = 0; j < claimable.length; j++) {
                var item = claimable[j];
                var credited = await claimDailyIncome(item.id, item.dailyAmount, false, null);
                if (credited > 0) { totalClaimed += credited; successCount++; }
            }

            claimAllRunning = false;
            if (claimBtn) claimBtn.innerText = 'Claim All';
            await loadAllPlans();
            if (successCount > 0) showToast('✅ Claimed ' + formatMoney(totalClaimed) + ' from ' + successCount + ' plan(s)!', false);
            else showToast('No claims were successful. Please try again.', true);
        }

        var tabBtns = document.querySelectorAll('.tab-btn');
        var activeTab = document.getElementById('activeTab');
        var expiredTab = document.getElementById('expiredTab');
        tabBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var tabId = this.dataset.tab;
                tabBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                if (tabId === 'active') {
                    activeTab.style.display = 'block';
                    expiredTab.style.display = 'none';
                    loadAllPlans();
                } else {
                    activeTab.style.display = 'none';
                    expiredTab.style.display = 'block';
                }
            });
        });

        document.getElementById('claimAllBtn')?.addEventListener('click', claimAllAvailable);

        // ================================================================
        // HAMBURGER MENU
        // ================================================================
        var hamburger = document.getElementById('hamburger');
        var menuPanel = document.getElementById('menuPanel');
        var closeMenu = document.getElementById('closeMenu');
        function toggleMenu() {
            var open = menuPanel.classList.toggle('open');
            hamburger.classList.toggle('active', open);
            document.body.style.overflow = open ? 'hidden' : '';
        }
        hamburger.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menuPanel.classList.contains('open')) toggleMenu();
        });

        // ================================================================
        // BOTTOM NAV
        // ================================================================
        var navItems = document.querySelectorAll('.nav-item');
        var currentPage = window.location.pathname.split('/').pop() || 'income.html';
        navItems.forEach(function(item) {
            var targetPage = item.getAttribute('data-page');
            if (currentPage === targetPage) item.classList.add('active');
            item.addEventListener('click', function() {
                var target = this.getAttribute('data-page');
                if (target && !window.location.pathname.includes(target)) window.location.href = target;
            });
        });

        console.log('✅ Server-time verified claims active. Amounts match exactly on display, credit and toast.');
    </script>

</body>
