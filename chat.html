                        inset 0 0 8px rgba(16,185,129,0.20);

        .ai-avatar .avatar-symbol {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-violet) 0%, var(--brand-cyan) 100%);

            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.15);

        }

        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.28; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
        .empty-state { text-align: center; padding: 30px 16px; color: rgba(255,255,255,0.4); align-self: center; margin: auto 0; }
        .empty-state .empty-avatar { width: 76px; height: 76px; margin: 0 auto 14px; border-width: 3px; padding: 5px; box-shadow: 0 0 26px -4px rgba(16,185,129,0.85), 0 0 50px -14px rgba(16,185,129,0.55), inset 0 0 12px rgba(16,185,129,0.25); }

        .input-area {

        .send-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 55%, #047857 100%);

            text-decoration: none; letter-spacing: 0.02em;

        .nav-btn.nav-btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 55%, #047857 100%); border-color: rgba(52,211,153,0.65); color: #fff; box-shadow: 0 6px 16px -8px rgba(16,185,129,0.9); }
        .email-contact { display: flex; align-items: center; gap: 8px; background: rgba(245,197,66,0.06); border: 1px solid rgba(245,197,66,0.28); border-radius: 14px; padding: 8px 8px 8px 14px; margin-top: 10px; flex-wrap: wrap; }
        .email-contact .email-addr { font-weight: 800; color: var(--gold-300); font-size: 0.8rem; word-break: break-all; }
        .email-contact .email-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: 0.68rem; font-weight: 800; font-family: inherit; cursor: pointer; transition: background 0.2s; border: none; background: rgba(16,185,129,0.12); color: var(--emerald-300); text-decoration: none; -webkit-tap-highlight-color: transparent; }
        .email-contact .email-btn:hover { background: rgba(16,185,129,0.22); }
        .email-contact .email-btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .email-contact .email-btn.copy-success { color: var(--gold-300); background: rgba(245,197,66,0.14); }
        .toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 0.82rem;
            z-index: 9999; animation: toastIn 0.3s ease; max-width: 90%; text-align: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .toast.success { background: rgba(16,185,129,0.16); color: var(--emerald-200); border: 1px solid rgba(52,211,153,0.4); }
        .toast.error { background: rgba(239,68,68,0.14); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .assistant-avatar { width: 38px; height: 38px; padding: 2.5px; }
            .assistant-name { font-size: 0.85rem; }
            .assistant-status { font-size: 0.56rem; letter-spacing: 0.1em; }
            .back-btn { font-size: 0.74rem; padding: 6px 11px 6px 9px; }
            .back-btn svg { width: 14px; height: 14px; }
            .message { max-width: 90%; font-size: 0.85rem; padding: 10px 12px; }
            .msg-avatar { width: 24px; height: 24px; }
            .input-area { padding: 4px 4px 4px 14px; }
            .input-area input { font-size: 0.86rem; padding: 11px 0; }
            .send-btn { width: 42px; height: 42px; }
            .send-btn svg { width: 17px; height: 17px; }
            .nav-btn { font-size: 0.66rem; padding: 6px 11px; }
            .empty-state .empty-avatar { width: 66px; height: 66px; padding: 4px; }
        }
    </style>
</head>

    <script>
        // ================================================================
        // FIREBASE
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

        var GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY_HERE';
        var GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=' + GEMINI_API_KEY;
        var AI_NAME = 'Sajvera Campaign';
        var SUPPORT_EMAIL = 'Pureorecapital@gmail.com';

        // Safe markers that survive HTML escaping
        var NAV_OPEN = '\u0001NAVOPEN\u0001';
        var NAV_CLOSE = '\u0001NAVCLOSE\u0001';
        var EMAIL_TOKEN = '\u0001EMAILTOKEN\u0001';

        var chatBox = document.getElementById('chatBox');
        var userInput = document.getElementById('userInput');
        var sendBtn = document.getElementById('sendBtn');
        var backBtn = document.getElementById('backBtn');
        var currentUserId = null;
        var messagesRef = null;
        var unsubscribe = null;
        var isFirstLoad = true;
        var blockUnsub = null;

        // ================================================================
        // AI TRANSACTION FLOW STATE
        // ================================================================
        var assistantFlow = { state: 'idle', data: {} };
        var depositRules = {
            requireAmountMatch: true, requireAgentName: true,
            requireNetworkKeyword: true, requireTxKeyword: true, requireFutureDate: true
        };
        var hardcodedAgents = {
            mtn: [
                { number: '0967340042', name: 'Jeremiah ilunga' },
                { number: '0963070992', name: 'John Kabwe' }
            ],
            airtel: [
                { number: '0571518417', name: 'John Kabwe' }
            ]
        };

        function loadDepositRulesForAssistant() {
            return db.collection('systemSettings').doc('depositRules').get().then(function(doc) {
                if (doc.exists) {
                    var d = doc.data();
                    depositRules.requireAmountMatch = d.requireAmountMatch !== false;
                    depositRules.requireAgentName = d.requireAgentName !== false;
                    depositRules.requireNetworkKeyword = d.requireNetworkKeyword !== false;
                    depositRules.requireTxKeyword = d.requireTxKeyword !== false;
                    depositRules.requireFutureDate = d.requireFutureDate !== false;
                }
            }).catch(function(err) { console.warn('Deposit rules load failed:', err); });
        }

        function loadAgentsForAssistant(network) {
            return db.collection('systemSettings').doc('depositAgents').get().then(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    var agents = (data.agents && data.agents[network]) ? data.agents[network] : [];
                    if (agents.length > 0) return agents[Math.floor(Math.random() * agents.length)];
                }
                var fb = hardcodedAgents[network] || [];
                return fb.length > 0 ? fb[Math.floor(Math.random() * fb.length)] : null;
            }).catch(function(err) {
                console.warn('Agent load failed:', err);
                var fb = hardcodedAgents[network] || [];
                return fb.length > 0 ? fb[Math.floor(Math.random() * fb.length)] : null;
            });
        }

        function isWithdrawTimeAllowed() {
            var now = new Date();
            var h = now.getHours();
            return h >= 9 && h < 17;
        }

        function validateDepositSms(sms, data) {
            var lowerSms = sms.toLowerCase();
            var errors = [];
            var agentClean = String(data.agentNumber || '').replace(/\D/g, '');
            if (agentClean && lowerSms.indexOf(agentClean) === -1) {
                errors.push('Agent number (' + data.agentNumber + ') not found in SMS.');
            }
            if (depositRules.requireAgentName && data.accountName) {
                var parts = String(data.accountName).toLowerCase().split(' ');
                var found = parts.some(function(p) { return p.length > 2 && lowerSms.indexOf(p) !== -1; });
                if (!found) errors.push('Account name "' + data.accountName + '" not found in SMS.');
            }
            if (depositRules.requireAmountMatch) {
                var m = lowerSms.match(/(?:k|zmw|r|zar|usd|eur|gbp|ngn|ghs|tzs|zwl|cdf)\s*(\d+\.?\d*)/i);
                var smsAmt = m ? parseFloat(m[1]) : 0;
                if (Math.abs(smsAmt - data.amount) > 0.01) {
                    errors.push('SMS amount (' + smsAmt.toFixed(2) + ') does not match deposit (' + data.amount.toFixed(2) + ').');
                }
            }
            if (depositRules.requireNetworkKeyword) {
                if (!['mtn','airtel','zamtel'].some(function(n){return lowerSms.indexOf(n)!==-1;})) {
                    errors.push('No network keyword (MTN/Airtel/Zamtel) found in SMS.');
                }
            }
            if (depositRules.requireTxKeyword) {
                if (!['send','sent','received','paid','transfer','successful','payment'].some(function(k){return lowerSms.indexOf(k)!==-1;})) {
                    errors.push('No transaction keyword found in SMS.');
                }
            }
            if (depositRules.requireFutureDate) {
                var dm = lowerSms.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\b/);
                if (dm) {
                    var parsed = new Date(dm[1]);
                    if (!isNaN(parsed) && parsed > new Date()) {
                        errors.push('SMS contains a future transaction date (' + dm[1] + ').');
                    }
                }
            }
            return { valid: errors.length === 0, errors: errors };
        }

        // ================================================================
        // FLOW HANDLER — runs BEFORE Gemini/fallback
        // ================================================================
        async function handleAssistantFlow(text) {
            var lower = text.toLowerCase().trim();
            var state = assistantFlow.state;
            var d = assistantFlow.data;

            // Global cancel
            if (state !== 'idle' && /^(cancel|stop|exit|quit)$/i.test(lower)) {
                assistantFlow.state = 'idle';
                assistantFlow.data = {};
                return "No problem — cancelled. 😊 How else can I help you?";
            }

            // ---- START DEPOSIT ----
            if (state === 'idle') {
                if (/(i want to deposit|make a deposit|start deposit|deposit money|add money|deposit zmw|^deposit$|^deposit\s)/i.test(lower)) {
                    assistantFlow.state = 'deposit_amount';
                    assistantFlow.data = {};
                    return "Sure! Let's deposit some money 💰\n\nHow much would you like to deposit?\n\nMinimum: *1 ZMW* — no maximum.\n\nType the amount, e.g. *100*";
                }
                if (/(i want to withdraw|make a withdrawal|start withdrawal|cash out|^withdraw$|^withdraw\s|withdrawal money)/i.test(lower)) {
                    if (!isWithdrawTimeAllowed()) {
                        return "⏰ Withdrawals are only allowed between *09:00* and *17:00* (9 AM – 5 PM).\n\nPlease come back during those hours. Meanwhile I can still help you with deposits, plans, and other questions. 😊";
                    }

                }

                    return "Please enter a valid amount of at least *1 ZMW*.\n\nExample: *100*";

                assistantFlow.state = 'deposit_sms';

                }
                var validation = validateDepositSms(text, d);
                if (!validation.valid) {
                    return "❌ I couldn't verify your SMS yet:\n\n• " + validation.errors.join('\n• ') + "\n\nPlease paste the correct SMS, or type *cancel* to cancel.";

                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

                        agentNumber: d.agentNumber,
                        accountName: d.accountName,

                    });
                    var savedAmt = d.amount;
                    assistantFlow.state = 'idle';
                    assistantFlow.data = {};

                        "Amount: *" + savedAmt.toFixed(2) + " ZMW*\n" +
                        "Status: *Pending admin approval*\n\n" +

                    var bal = uDoc.exists ? (uDoc.data().walletBalance !== undefined ? uDoc.data().walletBalance : (uDoc.data().balance || 0)) : 0;
                    if (amt2 > bal) {
                        return "❌ You don't have enough balance.\n\nYour current wallet balance is *" + bal.toFixed(2) + " ZMW*.\n\nPlease enter a smaller amount or type *cancel*.";
                    }
                } catch (e) { console.warn(e); }
                d.amount = amt2;
                d.fee = amt2 * 0.10;
                d.net = amt2 * 0.90;

                return "Got it!\n\n💰 Amount: *" + amt2.toFixed(2) + " ZMW*\n" +

                    "Which network should we send the money to?\n\n• MTN\n• Airtel\n• Zamtel\n• Bank";
            }

            // ---- WITHDRAW: NETWORK ----
            if (state === 'withdraw_network') {

                else if (/\bzamtel\b/i.test(lower)) netW = 'zamtel';
                else if (/\bbank\b/i.test(lower)) netW = 'bank';

                if (netW === 'bank') {

                return "Please enter your 9-digit phone number on *" + netW.toUpperCase() + "*.\n\nPrefix should be " + h2 + " — e.g. *963219651*";
            }

            // ---- WITHDRAW: BANK ----

                d.bank = bk;
                assistantFlow.state = 'withdraw_card';
                return "Got it: *" + bk.toUpperCase() + "*\n\nPlease enter your *16-digit* bank card number.";

            // ---- WITHDRAW: CARD ----
            if (state === 'withdraw_card') {

                var pref2 = p2.substring(0, 2);

                assistantFlow.state = 'withdraw_confirm';
                return "Please confirm your withdrawal:\n\n" +
                    "📶 Network: *" + d.network.toUpperCase() + "*\n" +
                    "👤 Name: *" + name + "*\n" +
                    (d.network === 'bank'
                        ? "💳 Card: ****" + d.cardNumber.slice(-4) + "\n"

                    "Type *confirm* to submit, or *cancel* to abort.";
            }

            // ---- WITHDRAW: CONFIRM ----
            if (state === 'withdraw_confirm') {
                if (/^(confirm|yes|y|ok|submit|proceed)$/i.test(lower)) {
                    if (!isWithdrawTimeAllowed()) {
                        assistantFlow.state = 'idle';
                        assistantFlow.data = {};
                        return "⏰ Withdrawal window closed. Please try again between 09:00 and 17:00.";
                    }
                    try {
                        var snapshot = d;
                        await db.runTransaction(async function(transaction) {
                            var uref = db.collection('users').doc(currentUserId);
                            var usnap = await transaction.get(uref);
                            if (!usnap.exists) throw new Error('User not found');
                            var cur = usnap.data().walletBalance !== undefined ? usnap.data().walletBalance : (usnap.data().balance || 0);
                            if (cur < snapshot.amount) throw new Error('Insufficient balance');
                            var nb = cur - snapshot.amount;
                            transaction.update(uref, { walletBalance: nb, balance: nb });

                            var wref = db.collection('withdrawals').doc();
                            var wd = {
                                userId: currentUserId,
                                amount: snapshot.amount,
                                netAmount: snapshot.net,
                                fee: snapshot.fee,
                                status: 'pending',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                network: snapshot.network,
                                accountName: snapshot.accountName,
                                phone: snapshot.phone || '',
                                submittedVia: 'AI Assistant'
                            };
                            if (snapshot.network === 'bank') {
                                wd.bankName = snapshot.bank;
                                wd.cardNumber = snapshot.cardNumber;
                            }
                            transaction.set(wref, wd);
                        });
                        var finAmt = d.amount, finNet = d.net;
                        assistantFlow.state = 'idle';
                        assistantFlow.data = {};
                        return "🎉 *Withdrawal submitted successfully!*\n\n" +
                            "Amount: *" + finAmt.toFixed(2) + " ZMW*\n" +
                            "You'll receive: *" + finNet.toFixed(2) + " ZMW*\n" +
                            "Status: *Pending admin approval*\n\n" +
                            "You can track it in your *History* page. Admin usually processes within 24 hours. 🙏";
                    } catch (err) {
                        console.error('AI withdraw error:', err);
                        assistantFlow.state = 'idle';
                        assistantFlow.data = {};
                        return "❌ Sorry, I couldn't submit your withdrawal: " + err.message + "\n\nPlease try again or use the *Withdraw* page directly.";
                    }
                }
                return "Please type *confirm* to submit or *cancel* to abort.";
            }

            return null;
        }

        // ================================================================
        // FORMAT AI RESPONSE (fixes raw nav HTML + preserves all live HTML)
        // ================================================================
        function formatAIResponse(text) {
            var out = String(text == null ? '' : text);

            // Pull out nav markers
            var navGroups = [];
            var navMarkerRe = new RegExp(NAV_OPEN + '([\\s\\S]*?)' + NAV_CLOSE, 'g');
            out = out.replace(navMarkerRe, function(m, inner) {
                navGroups.push(inner);
                return '@@NAV_' + (navGroups.length - 1) + '@@';
            });

            // Extract legacy raw nav-btn-group blocks (from already-saved messages)
            out = out.replace(/<div class="nav-btn-group">[\s\S]*?<\/div>/g, function(m) {
                navGroups.push(m);
                return '@@NAV_' + (navGroups.length - 1) + '@@';
            });
            out = out.replace(/(?:<a\b[^>]*class="nav-btn[^"]*"[^>]*>[\s\S]*?<\/a>\s*)+/g, function(m) {
                navGroups.push('<div class="nav-btn-group">' + m + '</div>');
                return '@@NAV_' + (navGroups.length - 1) + '@@';
            });

            // Extract email placeholders
            var hasEmail = out.indexOf('[EMAIL_CONTACT]') !== -1;
            if (hasEmail) out = out.split('[EMAIL_CONTACT]').join(EMAIL_TOKEN);

            // Escape remaining HTML
            var safe = out.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Line-by-line
            var lines = safe.split('\n');
            var inList = false, listType = null, result = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i], trimmed = line.trim();
                var ol = trimmed.match(/^(\d+)\.\s+(.+)/);
                var ul = trimmed.match(/^[-•]\s+(.+)/);
                if (ol) {
                    if (!inList || listType !== 'ol') {
                        if (inList) result.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = true; listType = 'ol'; result.push('<ol>');
                    }
                    result.push('<li>' + ol[2] + '</li>');
                } else if (ul) {
                    if (!inList || listType !== 'ul') {
                        if (inList) result.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = true; listType = 'ul'; result.push('<ul>');
                    }
                    result.push('<li>' + ul[1] + '</li>');
                } else {
                    if (inList) { result.push(listType === 'ol' ? '</ol>' : '</ul>'); inList = false; listType = null; }
                    if (trimmed === '') result.push('<br>');
                    else if (/^─+$/.test(trimmed)) result.push('<hr>');
                    else if (/^\*[^*]+\*$/.test(trimmed)) {
                        // *heading* on its own line
                        result.push('<span class="section-title">' + trimmed.replace(/^\*|\*$/g, '') + '</span>');
                    } else if (/^[A-Z][A-Za-z ]{2,40}:$/.test(trimmed)) {
                        result.push('<span class="section-title">' + trimmed + '</span>');
                    } else {
                        var f = trimmed
                            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                            .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
                            .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
                        result.push(f);
                    }
                }
            }
            if (inList) result.push(listType === 'ol' ? '</ol>' : '</ul>');

            var html = result.join('<br>');
            if (hasEmail) html = html.split(EMAIL_TOKEN).join(buildEmailComponent());
            html = html.replace(/@@NAV_(\d+)@@/g, function(m, idx) { return navGroups[parseInt(idx, 10)] || ''; });
            html = html.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, function(m, p, url) {
                return p + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
            });
            html = html.replace(/<br>\s*(<\/?(?:ul|ol)>)/g, '$1');
            html = html.replace(/(<\/(?:ul|ol)>)\s*<br>/g, '$1');
            html = html.replace(/(@@NAV_\d+@@)\s*<br>/g, '$1');
            return html;
        }

        function displayMessage(doc) {
            var data = doc.data();
            if (!data || !data.text) return;
            var msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (data.isUser ? 'user-message' : 'ai-message');
            if (data.isUser) {
                msgDiv.innerHTML = userIconSVG + '<div class="msg-content">' + escapeHtml(data.text) + '</div>';
            } else {
                msgDiv.innerHTML = botIconSVG + '<div class="msg-content">' + formatAIResponse(data.text) + '</div>';
            }
            var empty = document.getElementById('emptyState');
            if (empty) empty.remove();
            chatBox.appendChild(msgDiv);
            if (isFirstLoad) { scrollToBottomImmediate(); isFirstLoad = false; }
            else scrollToBottom();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');

        }

        async function saveMessage(text, isUser) {
            if (!currentUserId) return;

            await messagesRef.add({
                text: text, isUser: isUser,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function loadChatHistory() {
            if (unsubscribe) unsubscribe();
            if (!currentUserId) return;
            messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
            var query = messagesRef.orderBy('timestamp', 'asc');
            var firstBatch = true;
            unsubscribe = query.onSnapshot(function(snap) {
                if (snap.empty && firstBatch) {
                    chatBox.innerHTML =
                        '<div class="empty-state" id="emptyState">' +
                            '<span class="ai-avatar empty-avatar">' +
                                '<span class="avatar-symbol">' +

                                '</span>' +
                            '</span>' +

                            '<div class="sub">Online • 24/7 — deposit or withdraw right here in chat</div>' +
                        '</div>';

                        "I can help you with *deposits* and *withdrawals* right here in the chat, plus explain any part of the platform: Marketplace, Saving, Loans, Daily Check-in, Treasure Hunt, referrals, and more.\n\n" +
                        "Try saying:\n• *deposit*\n• *withdraw*\n• *how do I save?*\n\n" +
                        "What would you like to do? 😊";

        async function getGeminiResponse(userMessage) {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY_HERE') return null;
            try {
                var sysPrompt =
                    "You are Sajvera Campaign, the virtual assistant for Sajvera Capital. " +
                    "Speak naturally and professionally. Use emojis sparingly. " +
                    "Key facts:\n" +
                    "- Support email only: Pureorecapital@gmail.com.\n" +
                    "- Withdrawals: 10% fee, allowed 09:00–17:00, money reaches account within 24h after approval.\n" +
                    "- Deposits: minimum 1 ZMW, no maximum. Admin approval usually within 24h.\n" +
                    "- Marketplace offers Invest Now (daily returns) and Buy Now (maturity payout).\n" +
                    "- Saving: Wealth, Reserve, Growth.\n" +
                    "- Loans: Sajvera Flex, PureOre Support, GoldMine Advance.\n" +
                    "- Treasure Hunt: 7-character codes, one-time use.\n" +
                    "- Daily Check-in: 7-day cycle, resets after Day 7.\n" +
                    "- Never claim to have modified accounts or balances.\n" +
                    "- For admin/owner questions, direct to Support.\n" +
                    "Answer directly.\n\nUser: " + userMessage;
                var res = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: sysPrompt }] }] })
                });
                if (!res.ok) return null;
                var data = await res.json();
                if (data.candidates && data.candidates.length > 0) {
                    var c = data.candidates[0].content;
                    if (c && c.parts && c.parts.length > 0) return c.parts[0].text;
                }
                return null;
            } catch (err) { console.warn('Gemini error:', err); return null; }
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        async function sendMessage(text) {
            if (!text || !text.trim()) return;
            if (!currentUserId) return;
            var cleanText = text.trim();
            userInput.disabled = true;
            sendBtn.disabled = true;
            await saveMessage(cleanText, true);
            showTyping();
            try {
                // 1) Check flow FIRST
                var flowReply = await handleAssistantFlow(cleanText);
                var reply;
                if (flowReply) {
                    reply = flowReply;
                } else {
                    // 2) Otherwise, Gemini → fallback
                    reply = await getGeminiResponse(cleanText);
                    if (!reply || !reply.trim()) reply = getFallbackResponse(cleanText);
                    var navBtns = getNavButtons(cleanText);
                    if (navBtns.length > 0) reply = reply + '\n\n' + NAV_OPEN + navBtns.join(' ') + NAV_CLOSE;
                }
                removeTyping();
                await saveMessage(reply, false);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            } catch (err) {
                console.error('sendMessage error:', err);
                removeTyping();
                var fb = getFallbackResponse(cleanText);
                await saveMessage(fb, false);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleSend() {
            var text = userInput.value.trim();
            if (text) { sendMessage(text); userInput.value = ''; }
        }

        // ================================================================
        // COPY EMAIL
        // ================================================================
        document.addEventListener('click', function(e) {
            var t = e.target.closest('#copyEmailBtn');
            if (!t) return;
            var email = SUPPORT_EMAIL;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(email).then(function() {
                    showToast('Email copied', false);
                    t.classList.add('copy-success');
                    setTimeout(function() { t.classList.remove('copy-success'); }, 2000);
                }).catch(function() { fallbackCopy(email, t); });
            } else fallbackCopy(email, t);
        });
        function fallbackCopy(text, btn) {
            var ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try {
                document.execCommand('copy');
                showToast('Email copied', false);
                btn.classList.add('copy-success');
                setTimeout(function() { btn.classList.remove('copy-success'); }, 2000);
            } catch (e) { showToast('Could not copy.', true); }
            document.body.removeChild(ta);
        }

            if (user) {
                authResolved = true;
                if (redirectTimeout) { clearTimeout(redirectTimeout); redirectTimeout = null; }
                currentUserId = user.uid;
                watchBlockStatus(currentUserId);
                fetchMarketplacePlans();
                loadDepositRulesForAssistant();
                loadChatHistory();
                setTimeout(function() { userInput.focus(); }, 600);
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) window.location.href = 'login.html';

                    }
                } else window.location.href = 'login.html';
            }
        }, function(err) { console.error('Auth error:', err); window.location.href = 'login.html'; });

            clearTimeout(resizeTimer);
