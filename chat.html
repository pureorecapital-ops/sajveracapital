<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Sajvera Campaign | Sajvera Capital</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ============================================================
           THEME TOKENS — Premium Black / Dark Green / Emerald / Gold
           ============================================================ */
        :root {
            --bg-black: #030604;

            --emerald-200: #a7f3d0;
            --emerald-300: #6ee7b7;
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;

            --gold-200: #fff3cf;
            --gold-300: #ffe9a3;
            --gold-400: #f7d774;
            --gold-500: #f5c542;

            /* Preserved purple/blue brand symbol */
            --brand-violet: #7c6df0;
            --brand-cyan: #5dd9f2;

            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.62);
            --faint: rgba(255, 255, 255, 0.42);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100%;
            color: var(--text);
            background-color: #030604;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-image:
                radial-gradient(700px 420px at 50% -10%, rgba(14, 58, 40, 0.7) 0%, rgba(3, 6, 4, 0) 68%),
                radial-gradient(560px 400px at 100% 110%, rgba(16, 185, 129, 0.08) 0%, rgba(3, 6, 4, 0) 62%),
                linear-gradient(180deg, #05130d 0%, #030a07 55%, #020504 100%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        /* ============================================================
           AI AVATAR — reusable component
           Purple/blue circular symbol preserved inside a dark green/
           black frame with emerald accents and a soft green glow.
           ============================================================ */
        .ai-avatar {
            flex-shrink: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, #0a2a1d 0%, #030a07 100%);
            border: 2px solid rgba(16, 185, 129, 0.55);
            padding: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 16px -3px rgba(16, 185, 129, 0.75),
                0 0 30px -10px rgba(16, 185, 129, 0.55),
                inset 0 0 8px rgba(16, 185, 129, 0.20);
        }

        .ai-avatar .avatar-symbol {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-violet) 0%, var(--brand-cyan) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(0, 0, 0, 0.15);
        }

        .ai-avatar .avatar-symbol svg {
            width: 58%;
            height: 58%;
            stroke: #ffffff;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 12px 12px 12px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 999px;
            padding: 8px 14px 8px 11px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #c9f7e4;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .back-btn:hover {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .assistant-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        /* Header avatar — larger scale of the reusable component */
        .assistant-avatar {
            width: 44px;
            height: 44px;
        }

        .assistant-meta {
            min-width: 0;
        }

        .assistant-name {
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #ffffff;
            white-space: nowrap;
        }

        .assistant-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--emerald-300);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
            70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* ============================================================
           CHAT BOX
           ============================================================ */
        .chat-box {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 2px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: auto;
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.25);
            border-radius: 10px;
        }

        /* ============================================================
           MESSAGES
           ============================================================ */
        .message {
            max-width: 86%;
            padding: 11px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 0.9rem;
            animation: msgFadeIn 0.28s ease;
            display: flex;
            align-items: flex-start;
            gap: 9px;
            position: relative;
        }

        @keyframes msgFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ----- USER MESSAGE (emerald bubble, right) ----- */
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #ffffff;
            border-bottom-right-radius: 5px;
            box-shadow:
                0 8px 24px -12px rgba(16, 185, 129, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .user-message .msg-icon {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            stroke: #ffffff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-top: 1px;
            opacity: 0.9;
        }

        /* ----- AI MESSAGE (dark green card, left) ----- */
        .ai-message {
            align-self: flex-start;
            background: linear-gradient(155deg, #0a2619 0%, #051510 100%);
            color: #ffffff;
            border: 1px solid rgba(16, 185, 129, 0.30);
            border-bottom-left-radius: 5px;
            box-shadow:
                0 10px 28px -20px rgba(0, 0, 0, 0.95),
                0 0 22px -14px rgba(16, 185, 129, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* Small AI avatar used inside messages */
        .msg-avatar {
            width: 26px;
            height: 26px;
            padding: 2px;
            border-width: 1.5px;
            margin-top: 2px;
            box-shadow:
                0 0 10px -2px rgba(16, 185, 129, 0.75),
                0 0 18px -6px rgba(16, 185, 129, 0.55),
                inset 0 0 5px rgba(16, 185, 129, 0.20);
        }

        .ai-message .msg-content {
            flex: 1;
            min-width: 0;
        }

        /* Gold accent labels inside AI responses */
        .ai-message .section-title {
            display: block;
            margin-top: 8px;
            font-weight: 800;
            color: var(--gold-300);
            letter-spacing: 0.005em;
        }

        .ai-message strong {
            color: var(--gold-300);
            font-weight: 800;
        }

        .ai-message a {
            color: var(--emerald-300);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .ai-message a:hover {
            color: var(--emerald-200);
        }

        .ai-message ul,
        .ai-message ol {
            padding-left: 1.4rem;
            margin: 6px 0;
        }

        .ai-message li {
            margin-bottom: 3px;
        }

        .ai-message hr {
            border: 0;
            border-top: 1px solid rgba(16, 185, 129, 0.15);
            margin: 8px 0;
        }

        /* ============================================================
           TYPING INDICATOR
           ============================================================ */
        .typing-indicator {
            align-self: flex-start;
            background: linear-gradient(155deg, #0a2619 0%, #051510 100%);
            border: 1px solid rgba(16, 185, 129, 0.30);
            border-radius: 16px;
            border-bottom-left-radius: 5px;
            padding: 11px 14px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 9px;
            animation: msgFadeIn 0.3s ease;
            box-shadow: 0 10px 28px -20px rgba(0, 0, 0, 0.95),
                        0 0 22px -14px rgba(16, 185, 129, 0.6);
        }

        .typing-indicator .dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 2px;
        }

        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald-400);
            opacity: 0.35;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.36s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.28; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: rgba(255, 255, 255, 0.4);
            align-self: center;
            margin: auto 0;
        }

        .empty-state .empty-avatar {
            width: 76px;
            height: 76px;
            margin: 0 auto 14px;
            border-width: 3px;
            padding: 5px;
            box-shadow:
                0 0 26px -4px rgba(16, 185, 129, 0.85),
                0 0 50px -14px rgba(16, 185, 129, 0.55),
                inset 0 0 12px rgba(16, 185, 129, 0.25);
        }

        .empty-state .title {
            font-size: 1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .empty-state .sub {
            font-size: 0.8rem;
            color: var(--faint);
            margin-top: 4px;
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area {
            display: flex;
            gap: 8px;
            background: linear-gradient(150deg, rgba(10, 34, 24, 0.9) 0%, rgba(4, 12, 9, 0.95) 100%);
            border-radius: 60px;
            padding: 5px 5px 5px 16px;
            align-items: center;
            border: 1.5px solid rgba(16, 185, 129, 0.22);
            flex-shrink: 0;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-area:focus-within {
            border-color: rgba(16, 185, 129, 0.7);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.10),
                        0 0 26px -6px rgba(16, 185, 129, 0.55);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: #ffffff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        .send-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 55%, #047857 100%);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, filter 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            color: #ffffff;
            box-shadow:
                0 8px 20px -10px rgba(16, 185, 129, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            -webkit-tap-highlight-color: transparent;
        }

        .send-btn:hover {
            filter: brightness(1.08);
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .send-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transform: translateX(1px);
        }

        /* ============================================================
           NAVIGATION BUTTONS INSIDE AI MESSAGES
           ============================================================ */
        .nav-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
            text-decoration: none;
            letter-spacing: 0.02em;
            background: rgba(16, 185, 129, 0.10);
            border: 1px solid rgba(52, 211, 153, 0.42);
            color: var(--emerald-300);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:hover {
            background: rgba(16, 185, 129, 0.18);
            transform: translateY(-1px);
        }

        .nav-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.nav-btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 55%, #047857 100%);
            border-color: rgba(52, 211, 153, 0.65);
            color: #ffffff;
            box-shadow: 0 6px 16px -8px rgba(16, 185, 129, 0.9);
        }

        /* ============================================================
           EMAIL CONTACT COMPONENT
           ============================================================ */
        .email-contact {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 197, 66, 0.06);
            border: 1px solid rgba(245, 197, 66, 0.28);
            border-radius: 14px;
            padding: 8px 8px 8px 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .email-contact .email-addr {
            font-weight: 800;
            color: var(--gold-300);
            font-size: 0.8rem;
            word-break: break-all;
        }

        .email-contact .email-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: rgba(16, 185, 129, 0.12);
            color: var(--emerald-300);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .email-contact .email-btn:hover {
            background: rgba(16, 185, 129, 0.22);
        }

        .email-contact .email-btn svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .email-contact .email-btn.copy-success {
            color: var(--gold-300);
            background: rgba(245, 197, 66, 0.14);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.82rem;
            z-index: 9999;
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.16);
            color: var(--emerald-200);
            border: 1px solid rgba(52, 211, 153, 0.4);
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .container {
                padding: 10px 10px 10px;
            }

            .assistant-avatar {
                width: 38px;
                height: 38px;
                padding: 2.5px;
            }

            .assistant-name {
                font-size: 0.85rem;
            }

            .assistant-status {
                font-size: 0.56rem;
                letter-spacing: 0.1em;
            }

            .back-btn {
                font-size: 0.74rem;
                padding: 6px 11px 6px 9px;
            }

            .back-btn svg {
                width: 14px;
                height: 14px;
            }

            .message {
                max-width: 90%;
                font-size: 0.85rem;
                padding: 10px 12px;
            }

            .msg-avatar {
                width: 24px;
                height: 24px;
            }

            .input-area {
                padding: 4px 4px 4px 14px;
            }

            .input-area input {
                font-size: 0.86rem;
                padding: 11px 0;
            }

            .send-btn {
                width: 42px;
                height: 42px;
            }

            .send-btn svg {
                width: 17px;
                height: 17px;
            }

            .nav-btn {
                font-size: 0.66rem;
                padding: 6px 11px;
            }

            .email-contact {
                padding: 6px 6px 6px 11px;
            }

            .email-contact .email-addr {
                font-size: 0.74rem;
            }

            .empty-state .empty-avatar {
                width: 66px;
                height: 66px;
                padding: 4px;
            }
        }

        @media (max-width: 360px) {
            .assistant-name {
                font-size: 0.8rem;
            }

            .message {
                font-size: 0.82rem;
                padding: 9px 11px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
             HEADER — Sajvera Campaign avatar
             Dark green/black circular frame + emerald accents + green glow
             surrounding the preserved purple/blue circular symbol.
             ============================================================ -->
        <header class="header">
            <button class="back-btn" id="backBtn" type="button">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                Back
            </button>

            <div class="assistant-brand">
                <span class="ai-avatar assistant-avatar">
                    <span class="avatar-symbol">
                        <svg viewBox="0 0 24 24"><polyline points="6 6 18 6 6 18 18 18"/></svg>
                    </span>
                </span>
                <div class="assistant-meta">
                    <div class="assistant-name">Sajvera Campaign</div>
                    <div class="assistant-status">
                        <span class="status-dot"></span> Online • 24/7
                    </div>
                </div>
            </div>
        </header>

        <!-- ============================================================
             CHAT BOX
             ============================================================ -->
        <div class="chat-box" id="chatBox">
            <div class="empty-state" id="emptyState">
                <span class="ai-avatar empty-avatar">
                    <span class="avatar-symbol">
                        <svg viewBox="0 0 24 24"><polyline points="6 6 18 6 6 18 18 18"/></svg>
                    </span>
                </span>
                <div class="title">Sajvera Campaign</div>
                <div class="sub">Online • 24/7 — ask me anything about the platform</div>
            </div>
        </div>

        <!-- ============================================================
             INPUT AREA
             ============================================================ -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about deposits, withdrawals, plans…" autocomplete="off" />
            <button class="send-btn" id="sendBtn" type="button" aria-label="Send">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>

    </div>

    <!-- ================================================================
         JAVASCRIPT — Existing functionality preserved
         ----------------------------------------------------------------
         • Firebase config, auth, chat history, message saving untouched
         • AI avatar markup updated to the new green-framed component
         ================================================================ -->
    <script>
        // ================================================================
        // FIREBASE CONFIG (unchanged)
        // ================================================================
        var firebaseConfig = {
            apiKey: "AIzaSyALbWDHrhratYCCq3WpAu7jZFw6S8kTg2U",
            authDomain: "pureore-capital-zambia.firebaseapp.com",
            projectId: "pureore-capital-zambia",
            storageBucket: "pureore-capital-zambia.appspot.com",
            messagingSenderId: "78967797858",
            appId: "1:78967797858:web:379b9692951429c345793b",
            measurementId: "G-FQKC29NYE9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        db.settings({ persistence: true });

        // ================================================================
        // FORMAT AI RESPONSE
        // ================================================================
        function formatAIResponse(text) {
            var out = text;

            if (out.indexOf('[EMAIL_CONTACT]') !== -1) {
                out = out.replace(/\[EMAIL_CONTACT\]/g, buildEmailComponent());
            }

            var safe = out
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            if (text.indexOf('[EMAIL_CONTACT]') !== -1) {
                safe = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                safe = safe.replace(/\[EMAIL_CONTACT\]/g, '@@EMAIL_COMPONENT@@');
            }

            var lines = safe.split('\n');
            var inList = false;
            var listType = null;
            var result = [];

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.trim();

                var olMatch = trimmed.match(/^(\d+)\.\s+(.+)/);
                var ulMatch = trimmed.match(/^[-•]\s+(.+)/);

                if (olMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) result.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = true;
                        listType = 'ol';
                        result.push('<ol>');
                    }
                    result.push('<li>' + olMatch[2] + '</li>');
                } else if (ulMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) result.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = true;
                        listType = 'ul';
                        result.push('<ul>');
                    }
                    result.push('<li>' + ulMatch[1] + '</li>');
                } else {
                    if (inList) {
                        result.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = false;
                        listType = null;
                    }
                    if (trimmed === '') {
                        result.push('<br>');
                    } else if (/^─+$/.test(trimmed)) {
                        result.push('<hr>');
                    } else if (/^[A-Z][A-Za-z ]{2,40}:$/.test(trimmed)) {
                        result.push('<span class="section-title">' + trimmed + '</span>');
                    } else {
                        var formatted = trimmed.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                        result.push(formatted);
                    }
                }
            }
            if (inList) {
                result.push(listType === 'ol' ? '</ol>' : '</ul>');
            }

            var html = result.join('<br>');
            html = html.replace(/@@EMAIL_COMPONENT@@/g, buildEmailComponent());
            html = html.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
                return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
            });

            html = html.replace(/<br>\s*(<\/?(?:ul|ol)>)/g, '$1');
            html = html.replace(/(<\/(?:ul|ol)>)\s*<br>/g, '$1');

            return html;
        }

        // ================================================================
        // GEMINI API (optional — falls back to local engine if unavailable)
        // ================================================================
        async function getGeminiResponse(userMessage) {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY_HERE') {
                return null;
            }

            try {
                var systemPrompt =
                    "You are Sajvera Campaign, the virtual assistant for Sajvera Capital. " +
                    "Speak naturally and professionally, like a real helpful assistant. " +
                    "Use emojis sparingly (👋, 😊, 💰, 📥, 📤, 🎁, 📅, 🛒, 🆘). " +
                    "Key facts you may use:\n" +
                    "- Support email only: Pureorecapital@gmail.com. Do not invent any other contact.\n" +
                    "- Withdrawals: minimum 20 ZMW, 20% fee, processed Monday–Friday, money usually reaches the account within 24 hours after approval.\n" +
                    "- Deposits: minimum 70 ZMW, admin approval usually within 24 hours.\n" +
                    "- Marketplace plans offer Invest Now (daily returns) or Buy Now (maturity payout).\n" +
                    "- Saving has three branches: Wealth, Reserve, Growth.\n" +
                    "- Loans: Sajvera Flex, PureOre Support, GoldMine Advance.\n" +
                    "- Treasure Hunt uses 7-character codes, each usable once.\n" +
                    "- Daily Check-in: 7-day cycle, resets after Day 7.\n" +
                    "- Never claim to have modified accounts, balances, or transactions.\n" +
                    "- For admin/owner questions, say you can't give unverified personal information and direct to Support.\n" +
                    "- Never reveal API keys, Firebase credentials, or internal details.\n" +
                    "Answer the user's question directly and helpfully.\n\n" +
                    "User: " + userMessage;

                var response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                if (!response.ok) {
                    console.warn('Gemini API error:', response.status);
                    return null;
                }

                var data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    var content = data.candidates[0].content;
                    if (content && content.parts && content.parts.length > 0) {
                        return content.parts[0].text;
                    }
                }
                return null;
            } catch (err) {
                console.warn('Gemini API error:', err);
                return null;
            }
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        async function sendMessage(text) {
            if (!text || !text.trim()) return;
            if (!currentUserId) return;

            var cleanText = text.trim();

            userInput.disabled = true;
            sendBtn.disabled = true;

            await saveMessage(cleanText, true);
            showTyping();

            try {
                var reply = await getGeminiResponse(cleanText);

                if (!reply || !reply.trim()) {
                    reply = getFallbackResponse(cleanText);
                }

                var navBtns = getNavButtons(cleanText);
                if (navBtns.length > 0) {
                    reply = reply + '\n\n' + navBtns.join(' ');
                }

                removeTyping();
                await saveMessage(reply, false);

                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();

            } catch (err) {
                console.error('sendMessage error:', err);
                removeTyping();
                var fallbackReply = getFallbackResponse(cleanText);
                await saveMessage(fallbackReply, false);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleSend() {
            var text = userInput.value.trim();
            if (text) {
                sendMessage(text);
                userInput.value = '';
            }
        }

        // ================================================================
        // COPY EMAIL (delegated)
        // ================================================================
        document.addEventListener('click', function(e) {
            var target = e.target.closest('#copyEmailBtn');
            if (!target) return;

            var email = SUPPORT_EMAIL;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(email).then(function() {
                    showToast('Email copied', false);
                    target.classList.add('copy-success');
                    setTimeout(function() { target.classList.remove('copy-success'); }, 2000);
                }).catch(function() {
                    fallbackCopy(email, target);
                });
            } else {
                fallbackCopy(email, target);
            }
        });

        function fallbackCopy(text, btn) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Email copied', false);
                btn.classList.add('copy-success');
                setTimeout(function() { btn.classList.remove('copy-success'); }, 2000);
            } catch (e) {
                showToast('Could not copy — please copy manually.', true);
            }
            document.body.removeChild(textarea);
        }

        // ================================================================
        // AUTH STATE (unchanged flow)
        // ================================================================
        var authResolved = false;
        var redirectTimeout = null;

        auth.onAuthStateChanged(async function(user) {
            if (user) {
                authResolved = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                currentUserId = user.uid;
                watchBlockStatus(currentUserId);

                fetchMarketplacePlans();

                loadChatHistory();
                setTimeout(function() { userInput.focus(); }, 600);
            } else {
                if (!authResolved) {
                    if (!redirectTimeout) {
                        redirectTimeout = setTimeout(function() {
                            if (!auth.currentUser) {
                                window.location.href = 'login.html';
                            }
                        }, 2000);
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }
        }, function(error) {
            console.error('Auth state error:', error);
            window.location.href = 'login.html';
        });

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        backBtn.addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                scrollToBottomImmediate();
            }, 200);
        });

        console.log('✨ Sajvera Campaign assistant loaded');
        console.log('🎨 AI avatar: purple/blue symbol inside emerald-framed dark green circle');
        console.log('📧 Support email: ' + SUPPORT_EMAIL);
    </script>
