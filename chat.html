function showToast(msg, isError){

// ================================================================
// NATURAL LANGUAGE HELPERS — INVEST & REFERRAL INTENT
// ================================================================
// Extract a ZMW amount from free-form English. Handles:
//   "100", "K100", "K 100", "100 kwacha", "100 zmw", "K1,000.50", "1,000"
function extractAmount(text){
  var str = String(text||'').toLowerCase().trim();
  // Prefer explicit currency marker
  var m = str.match(/(?:k|zmw|kwacha|kw)\s*([0-9]+(?:[.,][0-9]+)?)/i);
  if (m) return parseFloat(m[1].replace(/,/g,''));
  // Otherwise, any standalone number 1-6 digits
  var nums = str.match(/\b([0-9]{1,6}(?:[.,][0-9]+)?)\b/g);
  if (nums && nums.length){
    for (var i=0;i<nums.length;i++){
      var v = parseFloat(nums[i].replace(/,/g,''));
      if (!isNaN(v) && v >= 1) return v;
    }
  }
  return null;
}

// Detect invest intent in normal English — no exact phrase needed.
function isInvestIntent(text){
  var t = String(text||'').toLowerCase();
  var patterns = [
    /\binvest\b/, /\binvesting\b/, /\binvestment\b/, /\binvestments\b/,
    /\bmarketplace\b/, /\bmarket\s*place\b/,
    /\bput\s+(?:my\s+)?(?:money|k|zmw|kwacha|cash|amount)\b/,
    /\bbuy\s+(?:a\s+)?plan\b/,
    /\bwhat\s+can\s+i\s+(?:get|buy|invest|put|afford)\b/,
    /\bwhich\s+(?:plan|investment)\b/,
    /\bavailable\s+(?:plan|plans|investment|investments)\b/,
    /\bshow\s+me\s+(?:a\s+|the\s+|something\s+)?(?:plan|plans|investment|investments)\b/,
    /\bi\s+have\s+(?:k|zmw|kwacha|\$)?\s*\d+/,
    /\bi\s+want\s+to\s+(?:invest|put\s+my\s+money|put\s+money|start\s+with)\b/,
    /\bwhat\s+(?:plan|investment)\s+can\s+i\b/,
    /\bcan\s+i\s+afford\b/,
    /\bstart\s+with\s+(?:k|zmw|kwacha|\$)?\s*\d+/,
    /\bwhere\s+can\s+i\s+invest\b/
  ];
  for (var i=0;i<patterns.length;i++) if (patterns[i].test(t)) return true;
  return false;
}

// Detect referral intent
function isReferralIntent(text){
  var t = String(text||'').toLowerCase();
  var patterns = [
    /\breferral\b/, /\breferrals\b/, /\brefer\b/, /\breferring\b/,
    /\breferral\s+code\b/, /\brefer\s+code\b/,
    /\bmy\s+code\b/, /\bmy\s+referral\b/,
    /\binvite\s+code\b/, /\binvite\s+link\b/, /\binvitation\s+code\b/,
    /\bshare\s+code\b/, /\bshare\s+link\b/, /\bshare\s+my\s+link\b/,
    /\bmy\s+link\b/, /\bmy\s+referral\s+link\b/,
    /\brefer\s+friends\b/, /\binvite\s+friends\b/
  ];
  for (var i=0;i<patterns.length;i++) if (patterns[i].test(t)) return true;
  return false;
}

// ================================================================
// MARKETPLACE PLAN SEARCH — real Firestore data only
// ================================================================
async function findPlansForAmount(amount){
  try{
    var snap = await db.collection('marketplacePlans')
      .where('showOnMarketplace','==',true).get();
    var matches = [];
    snap.forEach(function(doc){
      var d = doc.data();
      d.id = doc.id;
      var price = parseFloat(d.investmentPrice || d.minAmount || 0);
      if (Math.abs(price - amount) < 0.01){
        matches.push(d);
      }
    });
    return matches;
  }catch(err){
    console.warn('Plan search error:', err);
    return null; // null = error, [] = no match
  }
}

function buildPlanBlock(plan){
  var name = plan.planName || plan.name || 'Plan';
  var price = parseFloat(plan.investmentPrice || plan.minAmount || 0);
  var daily = parseFloat(plan.dailyReturn || 0);
  var days = parseInt(plan.earningDays || plan.days || 0, 10);
  var totalProfit = parseFloat(plan.totalProfit || 0);
  var type = plan.planType === 'buy' ? 'buy' : 'invest';
  var s = '';
  s += '🌱 *' + name + '*\n';
  s += '💰 Investment: *K' + price.toFixed(2) + '*\n';
  if (type === 'invest'){
    s += '📈 Daily income: *K' + daily.toFixed(2) + '*\n';
    s += '📅 Duration: *' + days + ' days*\n';
    s += '💵 Total income: *K' + (daily*days).toFixed(2) + '*\n';
  } else {
    s += '📈 Profit: *K' + totalProfit.toFixed(2) + '*\n';
    s += '📅 Duration: *' + days + ' days*\n';
    s += '💵 Total at maturity: *K' + (price + totalProfit).toFixed(2) + '*\n';
  }
  return s;
}

async function performInvestSearch(amount){
  var matches = await findPlansForAmount(amount);
  if (matches === null){
    flow.state='idle'; flow.data={};
    return "I'm having trouble checking the available Marketplace plans right now. 😟\n\nPlease try again in a moment, or open the *Marketplace* page from your dashboard.";
  }
  if (matches.length === 0){
    flow.state='idle'; flow.data={};
    return "I understand 😊 You want to invest *K" + amount.toFixed(2) + "*.\n\n" +
      "I checked the currently available Marketplace plans, but I couldn't find a plan available for K" + amount.toFixed(2) + " at the moment. 💚\n\n" +
      "Please check the available plans or contact Sajvera Capital Support for assistance:\n\n[EMAIL_CONTACT]";
  }

  var msg;
  if (matches.length === 1){
    msg = "Absolutely 😊 I can help you find an investment for *K" + amount.toFixed(2) + "*.\n\n" +
      "I found an available plan:\n\n" + buildPlanBlock(matches[0]) +
      "\nWould you like to continue?\n\n" +
      "Tap *Marketplace* below to see the full details and confirm your investment.";
  } else {
    msg = "Sure 😊 I found these available options for *K" + amount.toFixed(2) + "*:\n\n";
    for (var i=0;i<matches.length;i++){
      msg += buildPlanBlock(matches[i]);
      msg += '\n';
    }
    msg += "Which one would you like to choose?\n\n" +
      "Tap *Marketplace* below to see all details and confirm.";
  }

  flow.state='idle'; flow.data={};
  return msg;
}

async function showReferralCode(){

    return "Please log in first so I can show you your referral code. 😊";

  try{
    var doc = await db.collection('users').doc(currentUserId).get();
    if (!doc.exists){

    }

    var code = data.referralCode;
    if (!code){

    }
    var url = window.location.href;
    var base = url.substring(0, url.lastIndexOf('/') + 1);
    var link = base + 'register.html?ref=' + code;

    return "Sure 😊 Here's your referral code:\n\n" +
      "🎁 *Referral Code:* `" + code + "`\n\n" +
      "🔗 *Referral Link:*\n" + link + "\n\n" +
      "Share this link with friends. When someone registers with your code, makes their first completed deposit, and buys an investment plan, you earn a *5% bonus* on that deposit. 👥💰";
  }catch(err){
    console.warn('Referral fetch error:', err);
    return "I couldn't load your referral code right now. Please try again or contact Support:\n\n[EMAIL_CONTACT]";
  }
}

function loadDepositRulesForAssistant(){
  return db.collection('systemSettings').doc('depositRules').get().then(function(doc){
    if(doc.exists){ var d=doc.data();
      depositRules.requireAmountMatch=d.requireAmountMatch!==false;
      depositRules.requireAgentName=d.requireAgentName!==false;
      depositRules.requireNetworkKeyword=d.requireNetworkKeyword!==false;
      depositRules.requireTxKeyword=d.requireTxKeyword!==false;
      depositRules.requireFutureDate=d.requireFutureDate!==false;
    }
  }).catch(function(){});
}
function loadAgentsForAssistant(network){
  return db.collection('systemSettings').doc('depositAgents').get().then(function(doc){
    if(doc.exists){ var data=doc.data();
      var list=(data.agents && data.agents[network]) ? data.agents[network] : [];
      if(list.length>0) return list[Math.floor(Math.random()*list.length)];
    }
    var fb=hardcodedAgents[network]||[];
    return fb.length>0 ? fb[Math.floor(Math.random()*fb.length)] : null;
  }).catch(function(){
    var fb=hardcodedAgents[network]||[];
    return fb.length>0 ? fb[Math.floor(Math.random()*fb.length)] : null;
  });
}
function loadBalance(){
  if(!currentUserId) return Promise.resolve(0);
  return db.collection('users').doc(currentUserId).get().then(function(doc){
    if(doc.exists){ var d=doc.data();
      userBalance = d.walletBalance !== undefined ? d.walletBalance : (d.balance||0);
    }
    return userBalance;
  }).catch(function(){ return userBalance; });
}

// ================================================================
// SMS VALIDATION
// ================================================================
function validateDepositSmsLocal(sms, d){
  var lower = String(sms).toLowerCase(); var errors=[];
  var agentClean = String(d.agentNumber||'').replace(/\D/g,'');
  if(agentClean && lower.indexOf(agentClean)===-1) errors.push('Agent number not found in SMS.');
  if(depositRules.requireAgentName && d.accountName){
    var parts = String(d.accountName).toLowerCase().split(' ');
    if(!parts.some(function(p){return p.length>2 && lower.indexOf(p)!==-1;})) errors.push('Account name not found in SMS.');
  }
  if(depositRules.requireAmountMatch){
    var m = lower.match(/(?:k|zmw|kwacha|\$)\s*(\d+\.?\d*)/i);
    var smsAmt = m ? parseFloat(m[1]) : 0;
    if(Math.abs(smsAmt - d.amount) > 0.01) errors.push('SMS amount ('+smsAmt.toFixed(2)+') does not match deposit ('+d.amount.toFixed(2)+').');
  }
  if(depositRules.requireNetworkKeyword){
    if(!['mtn','airtel','zamtel'].some(function(n){return lower.indexOf(n)!==-1;})) errors.push('Network keyword missing from SMS.');
  }
  if(depositRules.requireTxKeyword){
    if(!['send','sent','received','paid','transfer','successful','payment'].some(function(k){return lower.indexOf(k)!==-1;})) errors.push('Transaction keyword missing from SMS.');
  }
  if(depositRules.requireFutureDate){
    var dm = lower.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\b/);
    if(dm){ var parsed = new Date(dm[1]); if(!isNaN(parsed) && parsed > new Date()) errors.push('SMS contains a future date.'); }
  }
  return { valid: errors.length===0, errors: errors };
}

// ================================================================
// FLOW ENGINE
// ================================================================
async function handleAssistantFlow(text){
  var lower = String(text||'').toLowerCase().trim();
  var st = flow.state; var d = flow.data;

  // Global cancel
  if(st!=='idle' && /^(cancel|stop|exit|quit)$/i.test(lower)){
    flow.state='idle'; flow.data={};
    return "No problem — cancelled. 😊 Anything else I can help with?";
  }

  // ============ IDLE — detect intents (order matters) ============
  if(st==='idle'){
    // ---- REFERRAL (checked first — very specific) ----
    if (isReferralIntent(lower)){
      return await showReferralCode();
    }

    // ---- INVEST / MARKETPLACE ----
    if (isInvestIntent(lower)){
      var amt = extractAmount(text);
      if (amt && amt >= 1){
        flow.state = 'invest_search';
        var reply = await performInvestSearch(amt);
        return reply;
      }
      flow.state = 'invest_amount'; flow.data = {};
      return "Sure 😊 What amount would you like to invest?\n\nMinimum: *1 ZMW*.\n\nExample: *100*";
    }

    // ---- DEPOSIT ----
    var m = lower.match(/(?:deposit|top up|add money|fund)\s*(?:k|zmw|kwacha|\$)?\s*(\d+(?:\.\d+)?)/i);
    var mNoAmt = /(i want to deposit|make a deposit|start deposit|^deposit$|^deposit\s)/i.test(lower);
    if(m || mNoAmt){
      flow.state='deposit_amount'; flow.data={};
      if(m){
        var a = parseFloat(m[1]);
        if(!isNaN(a) && a>=1){
          flow.data.amount=a; flow.state='deposit_network';
          return "Sure 😊 I can help you with your *"+a.toFixed(2)+" ZMW* deposit.\n\nWhich network would you like to use?\n\n"+
            btnToken('net','mtn','MTN')+' '+btnToken('net','airtel','Airtel')+' '+btnToken('net','zamtel','Zamtel');
        }
      }
      return "Sure! Let's deposit some money 💰\n\nHow much would you like to deposit?\n\nMinimum: *1 ZMW* — no maximum.\n\nType the amount, e.g. *100*";
    }

    // ---- WITHDRAW ----
    var wm = lower.match(/(?:withdraw|withdrawal|cash out|take out)\s*(?:k|zmw|kwacha|\$)?\s*(\d+(?:\.\d+)?)/i);
    var wNoAmt = /(i want to withdraw|make a withdrawal|start withdrawal|^withdraw$|^withdraw\s|withdrawal money|cash out)/i.test(lower);
    if(wm || wNoAmt){
      if(!withinWithdrawWindow()){
        return "⏰ Withdrawals are only allowed between *09:00* and *17:00* (9 AM – 5 PM).\n\nPlease come back during those hours. 😊";
      }
      await loadBalance();
      if(wm){
        var wamt = parseFloat(wm[1]);
        if(!isNaN(wamt) && wamt>=1){
          if(wamt > userBalance){
            return "❌ Your current wallet balance is *"+userBalance.toFixed(2)+" ZMW* — you don't have enough to withdraw *"+wamt.toFixed(2)+" ZMW*.\n\nWould you like to enter a smaller amount?";
          }
          flow.data.amount=wamt; flow.data.fee=wamt*0.10; flow.data.net=wamt-flow.data.fee;
          flow.state='withdraw_network';
          return "Sure 😊 I'll help you with that.\n\n✅ Available balance: *"+userBalance.toFixed(2)+" ZMW*\n💵 Amount: *"+wamt.toFixed(2)+" ZMW*\n📉 Fee (10%): "+flow.data.fee.toFixed(2)+" ZMW\n💰 You'll receive: *"+flow.data.net.toFixed(2)+" ZMW*\n\nWhich network should we send the money to?\n\n"+
            btnToken('net','mtn','MTN')+' '+btnToken('net','airtel','Airtel')+' '+btnToken('net','zamtel','Zamtel')+' '+btnToken('net','bank','Bank');
        }
      }
      flow.state='withdraw_amount'; flow.data={};
      return "Sure 😊 I'll help you with that.\n\nYour current wallet balance is *"+userBalance.toFixed(2)+" ZMW*.\n\nA *10% processing fee* applies. How much would you like to withdraw?\n\nType the amount, e.g. *200*";
    }
  }

  // ============ INVEST: AMOUNT ============
  if (st==='invest_amount'){
    var ia = extractAmount(text);
    if (!ia || ia < 1){
      return "Please enter a valid amount of at least *1 ZMW*. Example: *100*";
    }
    return await performInvestSearch(ia);
  }

  // ============ DEPOSIT: AMOUNT ============
  if(st==='deposit_amount'){
    var a = parseFloat(String(text).replace(/[^0-9.]/g,''));
    if(isNaN(a)||a<1) return "Please enter a valid amount of at least *1 ZMW*. Example: *100*";
    d.amount=a; flow.state='deposit_network';
    return "Great! You want to deposit *"+a.toFixed(2)+" ZMW*.\n\nWhich network would you like to use?\n\n"+
      btnToken('net','mtn','MTN')+' '+btnToken('net','airtel','Airtel')+' '+btnToken('net','zamtel','Zamtel');
  }

  // ============ DEPOSIT: NETWORK ============
  if(st==='deposit_network'){
    var n = matchNetwork(lower);
    if(!n) return "Please choose one of the buttons above or type: *MTN*, *Airtel*, or *Zamtel*.";
    if(n==='zamtel'){ flow.state='idle'; flow.data={}; return "🚀 Zamtel deposits are coming soon. Please choose *MTN* or *Airtel* instead."; }
    d.network=n; flow.state='deposit_phone';
    var hint = n==='mtn'?'96 or 76':'97, 77, or 57';
    return "Great — *"+n.toUpperCase()+"* it is.\n\nPlease enter your *9-digit* phone number (without +260).\n\nPrefix should be "+hint+" — e.g. *963219651*";
  }

  // ============ DEPOSIT: PHONE ============
  if(st==='deposit_phone'){
    var p = String(text).replace(/\D/g,'');
    if(p.length!==9) return "Please enter exactly *9 digits* (without +260). Example: *963219651*";
    var prefix = p.substring(0,2);
    var valid = d.network==='mtn' ? ['96','76'] : ['97','77','57'];
    if(valid.indexOf(prefix)===-1) return "That prefix doesn't match *"+d.network.toUpperCase()+"*.\n\nValid prefixes: "+valid.join(', ')+"\n\nPlease enter your 9-digit phone again.";
    d.phone='+260'+p;
    var agent = await loadAgentsForAssistant(d.network);
    if(!agent){ flow.state='idle'; flow.data={}; return "Sorry, no agent is currently available for *"+d.network.toUpperCase()+"*. Please try another network or contact support."; }
    d.agentNumber=agent.number; d.accountName=agent.name; d.agentId=agent.id||'';
    flow.state='deposit_sms';
    return "✅ Send *ZMW "+d.amount.toFixed(2)+"* to:\n\n"+
      "📶 *"+d.network.toUpperCase()+"*\n🏦 Agent: *"+agent.number+"*\n👤 Name: *"+agent.name+"*\n📞 Your phone: "+d.phone+"\n\n"+
      "━━━━━━━━━━━━━\nAfter you send the money, *paste the SMS confirmation* here and I'll submit your deposit. 📝";
  }

  // ============ DEPOSIT: SMS ============
  if(st==='deposit_sms'){
    if(String(text).trim().length<15) return "That doesn't look like a full SMS. Please paste the complete confirmation.\n\n(Or type *cancel*.)";
    var val = validateDepositSmsLocal(text, d);
    if(!val.valid) return "❌ I couldn't verify your SMS yet:\n\n• "+val.errors.join('\n• ')+"\n\nPlease paste the correct SMS, or type *cancel*.";
    d.smsText=String(text).trim();
    flow.state='deposit_confirm';
    return "Please confirm your deposit:\n\n"+
      "💰 Amount: *"+d.amount.toFixed(2)+" ZMW*\n"+
      "📶 Network: *"+d.network.toUpperCase()+"*\n"+
      "📞 Phone: *"+d.phone+"*\n"+
      "🏦 Agent: "+d.agentNumber+"\n\n"+
      "Do you want me to submit this deposit?\n\n"+
      btnToken('confirm','confirm','✅ Confirm Deposit')+' '+btnToken('confirm','cancel','Cancel');
  }

  // ============ DEPOSIT: CONFIRM ============
  if(st==='deposit_confirm'){
    if(/^(cancel|no)$/i.test(lower)){ flow.state='idle'; flow.data={}; return "No problem, deposit cancelled. 😊"; }
    if(/^(confirm|yes|y|ok|submit)$/i.test(lower)){
      try{
        await db.collection('deposits').add({
          userId: currentUserId,
          amount: d.amount,
          phone: d.phone,
          network: d.network,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          smsText: d.smsText,
          agentNumber: d.agentNumber,
          accountName: d.accountName,
          agentId: d.agentId
        });
        var amtOK = d.amount;
        flow.state='idle'; flow.data={};
        return "🎉 *Deposit submitted successfully!*\n\n"+
          "💰 Amount: *"+amtOK.toFixed(2)+" ZMW*\n"+
          "📋 Status: *Pending admin approval*\n\n"+
          "It now appears in your *History* page. Admin usually approves within 24 hours. 🙏";
      }catch(err){
        console.error('deposit submit failed', err);
        flow.state='idle'; flow.data={};
        var em = (err && err.message) ? err.message : 'Please try again.';
        return "❌ I couldn't submit your deposit: "+em+"\n\nIf this keeps happening, please use the *Deposit* page or contact support:\n\n[EMAIL_CONTACT]";
      }
    }
    return "Please tap *Confirm Deposit* or *Cancel* above.";
  }

  // ============ WITHDRAW: AMOUNT ============
  if(st==='withdraw_amount'){
    var wa = parseFloat(String(text).replace(/[^0-9.]/g,''));
    if(isNaN(wa)||wa<1) return "Please enter a valid amount of at least *1 ZMW*. Example: *200*";
    if(!withinWithdrawWindow()){ flow.state='idle'; flow.data={}; return "⏰ Withdrawal window is closed. Please try again between *09:00* and *17:00*."; }
    await loadBalance();
    if(wa>userBalance) return "❌ Insufficient balance.\n\nYour wallet: *"+userBalance.toFixed(2)+" ZMW*.\n\nPlease enter a smaller amount or type *cancel*.";
    d.amount=wa; d.fee=wa*0.10; d.net=wa-d.fee;
    flow.state='withdraw_network';
    return "Got it!\n\n💰 Amount: *"+wa.toFixed(2)+" ZMW*\n💵 Fee (10%): "+d.fee.toFixed(2)+" ZMW\n✅ You'll receive: *"+d.net.toFixed(2)+" ZMW*\n\nWhich network should we send the money to?\n\n"+
      btnToken('net','mtn','MTN')+' '+btnToken('net','airtel','Airtel')+' '+btnToken('net','zamtel','Zamtel')+' '+btnToken('net','bank','Bank');
  }

  // ============ WITHDRAW: NETWORK ============
  if(st==='withdraw_network'){
    var wn = matchNetwork(lower);
    if(!wn) return "Please choose one of: *MTN*, *Airtel*, *Zamtel*, or *Bank*.";
    d.network=wn;
    if(wn==='bank'){ flow.state='withdraw_bank'; return "Which bank?\n\n"+btnToken('bank','ecobank','EcoBank')+' '+btnToken('bank','zanaco','Zanaco')+' '+btnToken('bank','absa','ABSA')+' '+btnToken('bank','stanbic','Stanbic'); }
    flow.state='withdraw_phone';
    var hint2 = wn==='mtn'?'96 or 76':wn==='airtel'?'97, 77, or 57':'95 or 75';
    return "Please enter your 9-digit phone number on *"+wn.toUpperCase()+"*.\n\nPrefix should be "+hint2+" — e.g. *963219651*";
  }

  // ============ WITHDRAW: BANK ============
  if(st==='withdraw_bank'){
    var b=null;
    if(/ecobank/i.test(lower)) b='ecobank';
    else if(/zanaco/i.test(lower)) b='zanaco';
    else if(/absa/i.test(lower)) b='absa';
    else if(/stanbic/i.test(lower)) b='stanbic';
    if(!b) return "Please choose: *EcoBank*, *Zanaco*, *ABSA*, or *Stanbic*.";
    d.bank=b; flow.state='withdraw_card';
    return "Got it — *"+b.toUpperCase()+"*.\n\nPlease enter your *16-digit* bank card number.";
  }

  // ============ WITHDRAW: CARD ============
  if(st==='withdraw_card'){
    var card = String(text).replace(/\D/g,'');
    if(card.length!==16) return "Please enter exactly *16 digits* for your card number.";
    d.cardNumber=card; flow.state='withdraw_name';
    return "Now please enter the *full name* on the account.\n\nExample: *John Kabwe*";
  }

  // ============ WITHDRAW: PHONE ============
  if(st==='withdraw_phone'){
    var wp = String(text).replace(/\D/g,'');
    if(wp.length!==9) return "Please enter exactly *9 digits* (without +260). Example: *963219651*";
    var pref=wp.substring(0,2);
    var vp = d.network==='mtn' ? ['96','76'] : d.network==='airtel' ? ['97','77','57'] : ['95','75'];
    if(vp.indexOf(pref)===-1) return "That prefix doesn't match *"+d.network.toUpperCase()+"*.\n\nValid: "+vp.join(', ')+"\n\nPlease enter again.";
    d.phone='+260'+wp; flow.state='withdraw_name';
    return "Finally, please enter the *full name* registered on that number.\n\nExample: *John Kabwe*";
  }

  // ============ WITHDRAW: NAME ============
  if(st==='withdraw_name'){
    var nm = String(text).trim();
    if(nm.length<3) return "Please enter a valid full name (at least 3 characters).";
    d.accountName=nm; flow.state='withdraw_confirm';
    var card2 = '📶 Network: *'+d.network.toUpperCase()+'*\n'+
      '👤 Name: *'+nm+'*\n'+
      (d.network==='bank' ? '💳 Card: ****'+d.cardNumber.slice(-4)+'\n' : '📞 Phone: *'+d.phone+'*\n')+
      '💰 Amount: *'+d.amount.toFixed(2)+' ZMW*\n'+
      '📉 Fee (10%): '+d.fee.toFixed(2)+' ZMW\n'+
      '💰 You will receive: *'+d.net.toFixed(2)+' ZMW*\n';
    return "You are requesting:\n\n"+card2+"\nDo you want me to submit this withdrawal?\n\n"+
      btnToken('confirm','confirm','✅ Confirm Withdrawal')+' '+btnToken('confirm','cancel','Cancel');
  }

  // ============ WITHDRAW: CONFIRM ============
  if(st==='withdraw_confirm'){
    if(/^(cancel|no)$/i.test(lower)){ flow.state='idle'; flow.data={}; return "No problem, withdrawal cancelled. 😊"; }
    if(/^(confirm|yes|y|ok|submit)$/i.test(lower)){
      if(!withinWithdrawWindow()){ flow.state='idle'; flow.data={}; return "⏰ Withdrawal window closed. Please try again between 09:00 and 17:00."; }
      try{
        var data = d;
        await db.runTransaction(async function(transaction){
          var userRef = db.collection('users').doc(currentUserId);
          var userSnap = await transaction.get(userRef);
          if(!userSnap.exists) throw new Error('User not found');
          var cur = userSnap.data().walletBalance !== undefined ? userSnap.data().walletBalance : (userSnap.data().balance || 0);
          if(cur < data.amount) throw new Error('Insufficient balance');
          var nb = cur - data.amount;
          transaction.update(userRef, { walletBalance: nb, balance: nb });

          var wref = db.collection('withdrawals').doc();
          var wd = {
            userId: currentUserId,
            amount: data.amount,
            netAmount: data.net,
            fee: data.fee,
            status: 'pending',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            network: data.network,
            accountName: data.accountName,
            phone: data.phone || ''
          };
          if(data.network==='bank'){ wd.bankName=data.bank; wd.cardNumber=data.cardNumber; }
          transaction.set(wref, wd);
        });
        var fin=d.amount, fnet=d.net;
        flow.state='idle'; flow.data={};
        return "🎉 *Withdrawal submitted successfully!*\n\n"+
          "💰 Amount: *"+fin.toFixed(2)+" ZMW*\n"+
          "✅ You'll receive: *"+fnet.toFixed(2)+" ZMW*\n"+
          "📋 Status: *Pending admin approval*\n\n"+
          "It now appears in your *History* page. Admin usually processes within 24 hours. 🙏";
      }catch(err){
        console.error('withdraw submit failed', err);
        flow.state='idle'; flow.data={};
        var em2 = (err && err.message) ? err.message : 'Please try again.';
        return "❌ I couldn't submit your withdrawal: "+em2+"\n\nIf this keeps happening, please use the *Withdraw* page or contact support:\n\n[EMAIL_CONTACT]";
      }
    }
    return "Please tap *Confirm Withdrawal* or *Cancel* above.";
  }

  return null;
}

function matchNetwork(lower){
  if(/\bmtn\b/i.test(lower)) return 'mtn';
  if(/\bairtel\b/i.test(lower)) return 'airtel';
  if(/\bzamtel\b/i.test(lower)) return 'zamtel';
  if(/\bbank\b/i.test(lower)) return 'bank';
  return null;
}

function formatAIResponse(text){
  var out = String(text==null?'':text);

  var navGroups = [];
  var navRe = new RegExp(NAV_OPEN+'([\\s\\S]*?)'+NAV_CLOSE,'g');
  out = out.replace(navRe, function(m,i){ navGroups.push(i); return '@@NAV_'+(navGroups.length-1)+'@@'; });

  var hasEmail = out.indexOf('[EMAIL_CONTACT]')!==-1;
  if(hasEmail) out = out.split('[EMAIL_CONTACT]').join(EMAIL_TOKEN);

  var buttons = [];
  out = out.replace(/\[\[BTN:([^\]:]+):([^\]:]+):([^\]]+)\]\]/g, function(m,action,ev,el){
    buttons.push({action:action,value:decodeURIComponent(ev),label:decodeURIComponent(el)});
    return '@@BTN_'+(buttons.length-1)+'@@';
  });

  var safe = out.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  var lines = safe.split('\n');
  var inList=false, listType=null, result=[];
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    var ol = line.match(/^(\d+)\.\s+(.+)/);
    var ul = line.match(/^[-•]\s+(.+)/);
    if(ol){
      if(!inList||listType!=='ol'){ if(inList) result.push(listType==='ol'?'</ol>':'</ul>'); inList=true; listType='ol'; result.push('<ol>'); }
      result.push('<li>'+ol[2]+'</li>');
    } else if(ul){
      if(!inList||listType!=='ul'){ if(inList) result.push(listType==='ol'?'</ol>':'</ul>'); inList=true; listType='ul'; result.push('<ul>'); }
      result.push('<li>'+ul[1]+'</li>');
    } else {
      if(inList){ result.push(listType==='ol'?'</ol>':'</ul>'); inList=false; listType=null; }
      if(line==='') result.push('<br>');
      else if(/^─+$/.test(line)) result.push('<hr>');
      else {
        var f = line.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
                    .replace(/`([^`\n]+)`/g,'<code>$1</code>');
        result.push(f);
      }
    }
  }
  if(inList) result.push(listType==='ol'?'</ol>':'</ul>');

  var html = result.join('<br>');
  html = html.replace(/@@BTN_(\d+)@@/g, function(m,idx){
    var b = buttons[parseInt(idx,10)]; if(!b) return '';
    var cls = b.value==='confirm'?'primary':(b.value==='cancel'?'danger':'');
    return renderChoiceBtn(b.action,b.value,b.label,cls);
  });
  if(hasEmail) html = html.split(EMAIL_TOKEN).join(buildEmailComponent());
  html = html.replace(/@@NAV_(\d+)@@/g, function(m,idx){ return navGroups[parseInt(idx,10)]||''; });
  html = html.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, function(m,p,url){ return p+'<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>'; });
  html = html.replace(/(@@BTN_\d+@@)\s*<br>/g,'$1');
  return html;
}

// ================================================================
// RENDER
// ================================================================
var userIconSVG = '<svg class="msg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
var botIconSVG = '<span class="ai-avatar msg-avatar"><span class="avatar-symbol"><svg viewBox="0 0 24 24"><polyline points="6 6 18 6 6 18 18 18"/></svg></span></span>';

function displayMessage(doc){
  var data = doc.data(); if(!data||!data.text) return;
  var el = document.createElement('div');
  el.className = 'message ' + (data.isUser ? 'user-message' : 'ai-message');
  if(data.isUser) el.innerHTML = userIconSVG + '<div class="msg-content">'+escapeHtml(data.text)+'</div>';
  else el.innerHTML = botIconSVG + '<div class="msg-content">'+formatAIResponse(data.text)+'</div>';
  var empty = document.getElementById('emptyState'); if(empty) empty.remove();
  chatBox.appendChild(el);
  if(isFirstLoad){ scrollToBottomImmediate(); isFirstLoad=false; } else scrollToBottom();
}
function showTyping(){
  removeTyping();
  var d = document.createElement('div');
  d.className = 'typing-indicator'; d.id='typingIndicator';
  d.innerHTML = botIconSVG + ' Sajvera Campaign is typing<span class="dots"><span></span><span></span><span></span></span>';
  chatBox.appendChild(d); scrollToBottom();
}
function removeTyping(){ var e=document.getElementById('typingIndicator'); if(e) e.remove(); }

async function saveMessage(text, isUser){
  if(!currentUserId) return;
  if(!messagesRef) messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
  await messagesRef.add({ text:text, isUser:isUser, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
}
function loadChatHistory(){
  if(unsubscribe) unsubscribe();
  if(!currentUserId) return;
  messagesRef = db.collection('chats').doc(currentUserId).collection('messages');
  var q = messagesRef.orderBy('timestamp','asc');
  var first = true;
  unsubscribe = q.onSnapshot(function(snap){
    if(snap.empty && first){
      chatBox.innerHTML = '<div class="empty-state" id="emptyState"><span class="ai-avatar empty-avatar"><span class="avatar-symbol"><svg viewBox="0 0 24 24"><polyline points="6 6 18 6 6 18 18 18"/></svg></span></span><div class="title">Sajvera Campaign</div><div class="sub">Online • 24/7 — I can help you invest, deposit, withdraw, and more</div></div>';
      saveMessage("Hello 👋 It's me, Sajvera Campaign.\n\nI can help you with:\n• *Invest* — try: *I want to invest K100*\n• *Deposit* — try: *deposit*\n• *Withdraw* — try: *withdraw*\n• *Referral* — try: *my referral code*\n• Any platform question\n\nWhat would you like to do? 😊", false).catch(function(){});
      first = false; return;
    }
    if(!snap.empty){
      var e = document.getElementById('emptyState'); if(e) e.remove();
      chatBox.innerHTML = '';
      snap.forEach(function(doc){ displayMessage(doc); });
      scrollToBottomImmediate();
    }
    first = false;
  }, function(err){ console.error('chat listener', err); });
}

// ================================================================
// SEND
// ================================================================
async function sendMessage(text){
  if(!text||!text.trim()) return;
  if(!currentUserId) return;
  var clean = text.trim();
  userInput.disabled = true; sendBtn.disabled = true;
  await saveMessage(clean, true);
  showTyping();
  try{
    var reply = await handleAssistantFlow(clean);
    if(!reply || !reply.trim()) reply = getFallbackResponse(clean);
    removeTyping();
    await saveMessage(reply, false);
  }catch(err){
    console.error('send error', err);
    removeTyping();
    await saveMessage(getFallbackResponse(clean), false);
  }
  userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
}
function handleSend(){ var t=userInput.value.trim(); if(t){ sendMessage(t); userInput.value=''; } }

// ================================================================
// BUTTONS
// ================================================================
chatBox.addEventListener('click', function(e){
  var b = e.target.closest('.chat-choice-btn'); if(!b) return;
  if(b.disabled) return;
  var action = b.getAttribute('data-btn-action');
  var value = b.getAttribute('data-btn-value');
  if(!action || !value) return;
  var label = b.textContent.trim();
  b.disabled = true;
  (async function(){
    await saveMessage(label, true);
    showTyping();
    try{
      var reply = await handleAssistantFlow(value);
      if(!reply) reply = getFallbackResponse(value);
      removeTyping();
      await saveMessage(reply, false);
    }catch(err){
      console.error('button error', err);
      removeTyping();
      await saveMessage("⚠️ Something went wrong. Please try again.", false);
    }
  })();
});

// ================================================================
// COPY EMAIL
// ================================================================
document.addEventListener('click', function(e){
  var t = e.target.closest('#copyEmailBtn'); if(!t) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(SUPPORT_EMAIL).then(function(){
      showToast('Email copied', false);
      t.textContent = '✅ Copied';
      setTimeout(function(){ t.textContent = '📋 Copy'; }, 2000);
    }).catch(function(){ showToast('Could not copy', true); });
  } else showToast('Copy not supported', true);
});

// ================================================================
// BLOCK LISTENER
// ================================================================
function watchBlockStatus(uid){
  if(blockUnsub) blockUnsub();
  blockUnsub = db.collection('users').doc(uid).onSnapshot(function(doc){
    if(doc.exists && doc.data().isBlocked===true){
      showToast('⚠️ Account blocked. Redirecting…', true);
      setTimeout(function(){ auth.signOut().then(function(){ window.location.href='login.html'; }); }, 2000);
    }
  }, function(){});
}
window.addEventListener('beforeunload', function(){ if(blockUnsub) blockUnsub(); });

// ================================================================
// AUTH
// ================================================================
var authResolved=false, redirectTimeout=null;
auth.onAuthStateChanged(async function(user){
  if(user){
    authResolved=true;
    if(redirectTimeout){ clearTimeout(redirectTimeout); redirectTimeout=null; }
    currentUserId = user.uid;
    watchBlockStatus(currentUserId);
    loadDepositRulesForAssistant();
    loadBalance();
    loadChatHistory();
    setTimeout(function(){ userInput.focus(); }, 600);
  } else {
    if(!authResolved){
      if(!redirectTimeout) redirectTimeout = setTimeout(function(){ if(!auth.currentUser) window.location.href='login.html'; }, 2000);
    } else window.location.href = 'login.html';
  }
}, function(){ window.location.href = 'login.html'; });

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keypress', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } });
backBtn.addEventListener('click', function(){ window.location.href='dashboard.html'; });

console.log('✨ Sajvera Campaign — natural language + invest + referral enabled');
